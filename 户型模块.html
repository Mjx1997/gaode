<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>户型介绍模块 - 独立平面图舱位版</title>
    <style>
        /* 基础重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 外部大容器：自适应网格布局 */
        .apartment-section {
            width: 100%;
            background-color: transparent; 
            padding: 24px; 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 24px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 单个卡片样式 */
        .apartment-card {
            background-color: #ffffff; 
            border-radius: 16px; 
            border: 1px solid #eaeaea; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .apartment-card:hover {
            transform: translateY(-2px);
            border-color: #d1d1d6;
        }

        /* 图片容器（控制纵横比 16:10）- 仅显示实景图 */
        .card-image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 62.5%; 
            background-color: #f5f5f7;
            overflow: hidden;
        }

        .apartment-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 标签 */
        .card-tag {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(29, 29, 31, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 3;
        }

        /* 文字内容区域 */
        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .card-price {
            font-size: 15px;
            color: #2563eb; 
            font-weight: 700;
            margin-bottom: 12px;
        }

        .card-desc {
            font-size: 13px;
            color: #86868b;
            line-height: 1.5;
            margin-bottom: 18px;
            min-height: 38px; 
        }

        /* 核心参数网格（横线上方） */
        .card-specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
            border-top: 1px solid #f5f5f7;
            padding-top: 14px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .spec-label {
            font-size: 11px;
            color: #86868b;
        }

        .spec-value {
            font-size: 13px;
            font-weight: 600;
            color: #1d1d1f;
        }

        /* ====================================================
           🖥️ 电脑端（PC）专属：横线下方的独立户型平面图舱位
           ==================================================== */
        .floorplan-container {
            width: 100%;
            height: 135px; /* 优雅的矮长方形结构 */
            background-color: #f5f5f7; /* 微灰色高质感背景底座 */
            border-radius: 8px;
            border: 1px dashed #e2e8f0; /* 现代感虚线边框 */
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 平面图本身 */
        .floorplan-preview-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保证平面图不被裁剪，完整展示 */
            padding: 8px; /* 留出安全边缘内边距 */
            background-color: #ffffff;
        }

        /* 标注水印角标（注明这个区域是展示户型图的） */
        .floorplan-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #1d1d1f;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            pointer-events: none; /* 防止遮挡点击 */
        }

        /* 底部操作按钮 */
        .card-button {
            width: 100%;
            background-color: #1d1d1f;
            color: #ffffff;
            text-align: center;
            padding: 12px 0;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            margin-top: auto; 
            transition: background-color 0.2s ease;
        }

        .card-button:hover {
            background-color: #000000;
        }

        /* ====================================================
           🔧 手机端专属自适应逻辑：【完全取消限制与局部纵向滚动，隐藏户型舱】
           ==================================================== */
        @media screen and (max-width: 640px) {
            .apartment-section {
                max-height: none !important; 
                overflow-y: visible !important; 
                padding: 16px;
                gap: 20px;
                grid-template-columns: 1fr; /* 单列纵向顺畅滚动 */
            }
            
            /* 🔍 核心改动：在手机端将横线下方的户型图区域完全隐藏，不恢复多余功能，防止臃肿卡顿 */
            .floorplan-container {
                display: none !important;
            }
            
            .card-content {
                padding: 16px;
            }
            
            .card-title {
                font-size: 17px;
            }
            
            .card-desc {
                min-height: auto; 
                margin-bottom: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="apartment-section">

                <a class="card-button" id="btn-card2" href="#" target="_blank">查看详情</a>

        </div>

        <div class="apartment-card" id="card-3">

                <div class="floorplan-container">

    </div>

    <script>

        // 底层数据流自动化动力引擎，请放心，这里无须任何人工修改
        function renderCard(id, data) {
            document.getElementById(`tag-${id}`).innerText = data.tag;
            document.getElementById(`title-${id}`).innerText = data.title;
            document.getElementById(`price-${id}`).innerText = data.price; 
            document.getElementById(`desc-${id}`).innerText = data.desc;
            document.getElementById(`spec1-${id}`).innerText = data.spec1;
            document.getElementById(`spec2-${id}`).innerText = data.spec2;
            document.getElementById(`img-real-${id}`).src = data.imgUrl;
            document.getElementById(`img-floor-${id}`).src = data.floorplanUrl;
            document.getElementById(`btn-${id}`).href = data.linkUrl;
        }

        renderCard('card1', configData.card1);
        renderCard('card2', configData.card2);
        renderCard('card3', configData.card3);
    </script>
</body>
</html>
