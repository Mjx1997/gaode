<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恒大世纪广场-在租房源列表 (高度分离独立锁定版)</title>
    <style>
        /* ==========================================================================
           📌 【配置中心 - 核心高度控制】
           如果你后期发现页面有留白或挤压，只需在此处修改对应的像素数值即可。
           ========================================================================== */
        :root {
            /* 🖥️ 电脑端设置：固定8条数据的高度 */
            /* 计算参考：单行高度约 62px + 间距 10px，8条数据完美无缝无跳动 */
            --desktop-list-height: 570px;

            /* 📱 手机端设置：固定8条数据的高度 */
            /* 计算参考：手机端单行内容纵向堆叠，单行高度约 76px + 间距 10px */
            /* 独立分开设置，彻底解决手机端因为行高不同导致的“大面积留空”或“展示不全”问题 */
            --mobile-list-height: 690px;
        }

        /* ==========================================
           1. 全局现代主义视觉重置
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html { 
            width: 100%;
            background-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #1f2329; 
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(31, 35, 41, 0.03), 0 1px 2px rgba(31, 35, 41, 0.02);
        }

        /* ==========================================
           2. 顶部现代卡片式筛选工具栏
           ========================================== */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid #f2f3f5;
        }
        
        .list-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2329;
            letter-spacing: 0.5px;
            position: relative;
            padding-left: 12px;
        }
        
        .list-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3.5px;
            height: 16px;
            background-color: #0052cc;
            border-radius: 2px;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            background: #f4f5f6; 
            padding: 4px;
            border-radius: 20px;
        }
        
        .tab-btn {
            padding: 6px 16px;
            border-radius: 16px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #646a73;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .tab-btn:hover { 
            color: #1f2329; 
        }
        
        .tab-btn.active {
            background: #ffffff;
            color: #0052cc;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 82, 204, 0.08);
        }

        /* ==========================================
           3. 桌面端对齐骨架线表头
           ========================================== */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #f7f9fa;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #646a73;
            margin-bottom: 12px;
        }
        
        .header-main-group {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 40px;
        }
        
        /* 💡 仅在此处增加了 display: flex 和 gap，使标题完美对齐数据列 */
        .header-area-floor {
            width: 200px;
            flex-shrink: 0;
            display: flex;
            gap: 24px;
        }
        
        .header-side-group {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        
        .header-status {
            width: 100px;
        }
        
        .header-action {
            width: 64px;
            text-align: right;
        }

        /* ==========================================================================
           4. 房源核心列表空间 (高度锁死核心区)
           ========================================================================== */
        .house-list { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            
            /* 💡 核心改动：默认读取电脑端变量，锁死整体高度，翻页时容器绝不缩水跳动 */
            min-height: var(--desktop-list-height); 
            max-height: var(--desktop-list-height);
            overflow: hidden; /* 防止溢出干扰 */
        }

        /* ==========================================
           5. 现代双向对齐式房源卡片行样式
           ========================================== */
        .house-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid #f0f1f2;
            background: #ffffff;
            cursor: pointer;
            height: 62px; /* 💡 电脑端强制单行高度固定，确保完美契合全局高度锁定 */
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.215, 0.610, 0.355, 1);
        }

        .house-row:hover {
            border-color: rgba(0, 82, 204, 0.3);
            background: #f8faff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 82, 204, 0.04);
        }

        .row-main-group {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 40px;
        }

        .area-floor-box {
            display: flex;
            align-items: center;
            gap: 24px;
            width: 200px;
            flex-shrink: 0;
        }

        .meta-area { 
            font-size: 20px; 
            font-weight: 700; 
            color: #0052cc; 
            font-family: "Helvetica Neue", Arial, sans-serif;
            min-width: 85px;
        }
        
        .meta-area .unit { 
            font-size: 12px; 
            font-weight: 500;
            margin-left: 2px; 
            color: #646a73;
        }
        
        .meta-floor { 
            font-size: 14px; 
            color: #1f2329; 
            font-weight: 500;
        }
        
        .meta-standard { 
            font-size: 14px; 
            color: #646a73; 
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .row-side-group {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .meta-status { 
            width: 100px;
            display: flex; 
            align-items: center; 
        }

        .status-badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        
        .status-badge.ready { 
            background: #e0f2fe; 
            color: #0369a1; 
        }
        
        .status-badge.booked { 
            background: #fef3c7; 
            color: #b45309; 
        }
        
        .status-badge .dot { 
            width: 6px; 
            height: 6px; 
            border-radius: 50%; 
            display: inline-block; 
        }
        
        .status-badge.ready .dot { background-color: #0284c7; }
        .status-badge.booked .dot { background-color: #d97706; }

        .meta-action {
            width: 64px;
            text-align: right;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            color: #0052cc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 6px;
            background: #f0f5ff;
            transition: all 0.2s ease;
        }
        
        .action-btn:hover { 
            background: #0052cc; 
            color: #ffffff; 
        }

        /* ==========================================
           6. 页码控制部件
           ========================================== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #f2f3f5;
        }
        
        .page-btn {
            min-width: 32px;
            height: 32px;
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid #dee0e3;
            background: #ffffff;
            cursor: pointer;
            font-size: 13px;
            color: #1f2329;
            transition: all 0.2s ease;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .page-btn:hover:not(.disabled) {
            background: #f4f5f6;
            border-color: #bbbfc4;
        }
        
        .page-btn.active {
            background: #0052cc;
            color: #ffffff;
            border-color: #0052cc;
            font-weight: 600;
        }
        
        .page-btn.disabled {
            background: #f5f6f7;
            color: #bbbfc4;
            cursor: not-allowed;
            border-color: #dee0e3;
        }

        /* ==========================================================================
           7. 📱 移动端媒体查询架构极致优化（完美分离配置）
           ========================================================================== */
        @media (max-width: 768px) {
            .list-header { 
                display: none; 
            }
            
            .container {
                padding: 16px;
            }

            .header-bar {
                margin-bottom: 16px;
            }

            /* 💡 核心改动：手机端独立切换到专门的手机锁死高度变量，拒绝多余空白 */
            .house-list {
                min-height: var(--mobile-list-height);
                max-height: var(--mobile-list-height);
            }

            .house-row {
                display: flex;
                flex-direction: row; 
                justify-content: space-between;
                align-items: stretch; 
                padding: 12px 14px;
                gap: 12px;
                height: 76px; /* 💡 手机端行高固定为 76px，配合全局变量完美填满空间 */
            }

            .row-main-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                flex: 1;
                overflow: hidden;
            }

            .area-floor-box {
                width: auto;
                gap: 10px;
                align-items: baseline; 
            }

            .meta-area {
                font-size: 19px; 
                min-width: auto;
            }

            .meta-floor {
                font-size: 11px;
                color: #646a73;
                background: #f4f5f6;
                padding: 1px 4px;
                border-radius: 4px;
                font-weight: 500;
            }

            .meta-standard {
                font-size: 12px;
                line-height: 1.3;
                width: 100%;
            }

            .row-side-group {
                flex-direction: column;
                justify-content: space-between; 
                align-items: flex-end;
                gap: 0;
                min-width: 80px; 
            }

            .meta-status {
                width: auto;
                justify-content: flex-end;
            }

            .status-badge {
                padding: 2px 6px;
                font-size: 11px;
                border-radius: 4px;
            }

            .meta-action {
                width: auto;
                text-align: right;
            }

            .action-btn {
                padding: 4px 10px;
                font-size: 12px;
                border-radius: 5px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="list-title">在租房源</div>
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterHouse('all', this)">全部</button>
            <button class="tab-btn" onclick="filterHouse('high', this)">高区</button>
            <button class="tab-btn" onclick="filterHouse('scenery', this)">江景</button>
        </div>
    </div>

    <div class="list-header">
        <div class="header-main-group">
            <div class="header-area-floor">
                <span style="min-width: 85px;">面积</span>
                <span>楼层</span>
            </div>
            <div class="header-standard">交付标准</div>
        </div>
        <div class="header-side-group">
            <div class="header-status">当前状态</div>
            <div class="header-action">资料</div>
        </div>
    </div>

    <div class="house-list" id="houseList"></div>

    <div class="pagination" id="pagination"></div>
</div>

<script>
    /**
     * 【原始房源数据库集群】
     * 💡 为了方便测试分页切换时“高度依然死锁不跳动”的效果，我特意为你将测试数据扩充到了 10 条（每页显示8条）
     * 这样你可以直接在电脑或手机上点击第 2 页，看看容器高度是不是完全保持稳定，不会缩水空出一大块！
     */
    const houseData = [
        { area: '285', floor: '12层', type: 'mid', standard: '精装修 · 带全套家具', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/1201.html' },
        { area: '420', floor: '18层', type: 'high', standard: '标准装修 · 吊顶白墙', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/1201.html' },
        { area: '1,100', floor: '25层', type: 'high', standard: '毛坯现房 · 空间自由', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/1201.html' },
        { area: '1,200', floor: '43层', type: 'scenery', standard: '顶级装修 · 环幕江景', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/1201.html' },
        { area: '150', floor: '6层', type: 'low', standard: '简约装修 · 采光极佳', status: 'booked', statusText: '已预订', link: 'http://www.hdcentury.com/1201.html' },
        { area: '310', floor: '15层', type: 'mid', standard: '精装修 · 经理室会议室齐全', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/1201.html' },
        { area: '560', floor: '22层', type: 'high', standard: '标准装修 · 随时定制大开间', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/1201.html' },
        { area: '880', floor: '31层', type: 'scenery', standard: '豪装核心层 · 正对中心绿地', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/1201.html' },
        { area: '190', floor: '9层', type: 'low', standard: '电商工作室精装 · 拎包入驻', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/1201.html' },
        { area: '640', floor: '28层', type: 'high', standard: '现代极简高标交付 · 视野开阔', status: 'booked', statusText: '已预订', link: 'http://www.hdcentury.com/1201.html' }
    ];

    let currentCategory = 'all'; 
    let currentPage = 1;          
    const itemsPerPage = 8; /* 💡 固定单页输出 8 条记录 */      

    function getFilteredData() {
        return currentCategory === 'all' 
            ? houseData 
            : houseData.filter(h => h.type === currentCategory);
    }

    function renderList() {
        const filtered = getFilteredData();
        const totalItems = filtered.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
        
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIndex = (currentPage - 1) * itemsPerPage;
        const pageData = filtered.slice(startIndex, startIndex + itemsPerPage);

        const listContainer = document.getElementById('houseList');
        listContainer.innerHTML = '';
        
        if (pageData.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center;color:#999;padding:60px 0;font-size:14px;width:100%;">暂无对应在租房源记录</div>';
        } else {
            pageData.forEach(item => {
                const statusClass = item.status === 'ready' ? 'ready' : 'booked';
                
                const itemHtml = `
                    <div class="house-row" onclick="window.open('${item.link}', '_parent')">
                        <div class="row-main-group">
                            <div class="area-floor-box">
                                <span class="meta-area">${item.area}<span class="unit">㎡</span></span>
                                <span class="meta-floor">${item.floor}</span>
                            </div>
                            <div class="meta-standard">${item.standard}</div>
                        </div>
                        <div class="row-side-group">
                            <div class="meta-status">
                                <span class="status-badge ${statusClass}">
                                    <span class="dot"></span>
                                    ${item.statusText}
                                </span>
                            </div>
                            <div class="meta-action">
                                <a href="${item.link}" class="action-btn" onclick="event.stopPropagation();">详情</a>
                            </div>
                        </div>
                    </div>
                `;
                listContainer.innerHTML += itemHtml;
            });
        }

        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        const paginationContainer = document.getElementById('pagination');
        paginationContainer.innerHTML = '';

        const prevBtn = document.createElement('button');
        prevBtn.className = `page-btn ${currentPage === 1 ? 'disabled' : ''}`;
        prevBtn.innerText = '‹';
        prevBtn.onclick = (e) => {
            e.stopPropagation();
            if (currentPage > 1) {
                currentPage--;
                renderList();
            }
        };
        paginationContainer.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            pageBtn.innerText = i;
            pageBtn.onclick = (e) => {
                e.stopPropagation();
                currentPage = i;
                renderList();
            };
            paginationContainer.appendChild(pageBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = `page-btn ${currentPage === totalPages ? 'disabled' : ''}`;
        nextBtn.innerText = '›';
        nextBtn.onclick = (e) => {
            e.stopPropagation();
            if (currentPage < totalPages) {
                currentPage++;
                renderList();
            }
        };
        paginationContainer.appendChild(nextBtn);
    }

    function filterHouse(category, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = category;
        currentPage = 1; 
        renderList();
    }

    renderList();
</script>
</body>
</html>
