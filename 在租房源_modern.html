<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恒大世纪广场-在租房源列表 (全员弹性居中自适应版)</title>
    <style>
        /* ==========================================
           1. 全局现代主义视觉重置与底色
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html { 
            width: 100%;
            background-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #1f2329; 
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(31, 35, 41, 0.03), 0 1px 2px rgba(31, 35, 41, 0.02);
        }

        /* ==========================================
           2. 顶部卡片式筛选工具栏 (保持原有分类)
           ========================================== */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid #f2f3f5;
        }
        
        .list-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2329;
            letter-spacing: 0.5px;
            position: relative;
            padding-left: 12px;
        }
        
        .list-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3.5px;
            height: 16px;
            background-color: #0052cc;
            border-radius: 2px;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            background: #f4f5f6; 
            padding: 4px;
            border-radius: 20px;
        }
        
        .tab-btn {
            padding: 6px 16px;
            border-radius: 16px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #646a73;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .tab-btn:hover { 
            color: #1f2329; 
        }
        
        .tab-btn.active {
            background: #ffffff;
            color: #0052cc;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 82, 204, 0.08);
        }

        /* ==========================================
           3. 桌面端动态骨架线表头基础样式
           ========================================== */
        .list-header {
            padding: 14px 24px;
            background: #f7f9fa;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
            color: #646a73;
            margin-bottom: 12px;
        }

        /* ==========================================
           4. 房源核心列表空间与动态行
           ========================================== */
        .house-list { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }

        .house-row {
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid #f0f1f2;
            background: #ffffff;
            cursor: pointer;
            height: 66px; 
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.215, 0.610, 0.355, 1);
        }

        .house-row:hover {
            border-color: rgba(0, 82, 204, 0.25);
            background: #f8faff;
            transform: translateY(-1.5px);
            box-shadow: 0 6px 20px rgba(0, 82, 204, 0.05);
        }

        /* ==========================================
           5. 核心高定原子元件视觉样式
           ========================================== */
        .meta-area { 
            font-size: 20px; 
            font-weight: 700; 
            color: #0052cc; 
            font-family: "Helvetica Neue", Arial, sans-serif;
        }
        
        .meta-area .unit { 
            font-size: 12px; 
            font-weight: 500;
            margin-left: 2px; 
            color: #646a73;
        }
        
        .meta-floor { 
            font-size: 14.5px; 
            color: #1f2329; 
            font-weight: 500;
        }
        
        .meta-standard { 
            font-size: 14px; 
            color: #595959; 
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 95%;
        }

        .status-badge {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        
        .status-badge.ready { background: #e0f2fe; color: #0369a1; }
        .status-badge.booked { background: #fef3c7; color: #b45309; }
        .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .status-badge.ready .dot { background-color: #0284c7; }
        .status-badge.booked .dot { background-color: #d97706; }

        .action-btn {
            display: inline-flex;
            align-items: center;
            color: #0052cc;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 6px;
            background: #f0f5ff;
            transition: all 0.2s ease;
        }
        
        .action-btn:hover { 
            background: #0052cc; 
            color: #ffffff; 
        }

        /* ==========================================
           6. 页码控制部件
           ========================================== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #f2f3f5;
        }
        
        .page-btn {
            min-width: 32px;
            height: 32px;
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid #dee0e3;
            background: #ffffff;
            cursor: pointer;
            font-size: 13px;
            color: #1f2329;
            transition: all 0.2s ease;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .page-btn:hover:not(.disabled) {
            background: #f4f5f6;
            border-color: #bbbfc4;
        }
        
        .page-btn.active {
            background: #0052cc;
            color: #ffffff;
            border-color: #0052cc;
            font-weight: 600;
        }
        
        .page-btn.disabled {
            background: #f5f6f7;
            color: #bbbfc4;
            cursor: not-allowed;
            border-color: #dee0e3;
        }

        /* ==========================================================================
           7. 📱 移动端自适应黑科技弹性响应 (无需修改此处CSS，全自动适配)
           ========================================================================== */
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .header-bar { margin-bottom: 16px; }
            .list-header { display: none !important; }

            .house-row {
                display: flex !important;
                flex-direction: row !important; 
                justify-content: space-between !important;
                align-items: center !important; 
                padding: 14px 16px !important;
                gap: 12px !important;
                height: auto !important; 
                min-height: 82px !important;
            }

            .cell-group-left {
                display: flex !important;
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 6px !important;
                flex: 1 !important;
                overflow: hidden !important;
            }

            .mobile-inner-row {
                display: flex !important;
                flex-direction: row !important;
                align-items: center !important;
                gap: 10px !important;
            }

            .cell-group-right {
                display: flex !important;
                flex-direction: column !important;
                align-items: flex-end !important;
                justify-content: center !important;
                gap: 10px !important;
                min-width: 85px !important;
            }

            .grid-cell {
                display: block !important;
                text-align: left !important;
                width: auto !important;
            }
            
            .cell-group-right .grid-cell {
                text-align: right !important;
            }

            .meta-area { font-size: 18px !important; }
            .meta-floor {
                font-size: 11px !important;
                color: #646a73 !important;
                background: #f4f5f6 !important;
                padding: 2px 6px !important;
                border-radius: 4px !important;
                font-weight: 500 !important;
            }

            .meta-standard {
                font-size: 12px !important;
                line-height: 1.4 !important;
                white-space: normal !important;
                display: -webkit-box !important;
                -webkit-line-clamp: 2 !important;
                -webkit-box-orient: vertical !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                max-width: 100% !important;
            }

            .status-badge { padding: 3px 8px !important; font-size: 11px !important; border-radius: 4px !important; }
            .action-btn { padding: 5px 12px !important; font-size: 12px !important; border-radius: 6px !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="list-title">在租房源</div>
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterHouse('all', this)">全部</button>
            <button class="tab-btn" onclick="filterHouse('high', this)">高区</button>
            <button class="tab-btn" onclick="filterHouse('scenery', this)">江景</button>
        </div>
    </div>

    <div class="list-header" id="listHeader"></div>

    <div class="house-list" id="houseList"></div>

    <div class="pagination" id="pagination"></div>
</div>

<script>
    const MAIN_CONTROL_CONFIG = {
        itemsPerPage: 8, 
        columns: [
            { key: 'area',     name: '面积',     width: '1fr',    align: 'center' },
            { key: 'standard', name: '交付标准', width: '2.5fr',  align: 'center' },
            { key: 'status',   name: '当前状态', width: '1.2fr',  align: 'center' },
            { key: 'action',   name: '资料/详情', width: '1fr',    align: 'center' }
        ]
    };

    const houseData = [
        { area: '85', type: 'mid', standard: '精装修 · 带全套家具', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/type1.html' },
        { area: '95', type: 'high', standard: '标准装修 · 吊顶白墙', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/type1.html' },
        { area: '120', type: 'high', standard: '毛坯现房 · 空间自由', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/type1.html' },
        { area: '133', type: 'scenery', standard: '顶级装修 · 环幕江景', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/type1.html' },
        { area: '150', type: 'low', standard: '简约装修 · 采光极佳', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/type1.html' },
        { area: '168', type: 'mid', standard: '精装修 · 经理室会议室齐全', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/type1.html' },
        { area: '200', type: 'high', standard: '标准装修 · 随时定制大开间', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/type1.html' },
        { area: '260', type: 'scenery', standard: '豪装核心层 · 正对中心绿地', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/type1.html' },
        { area: '300', type: 'low', standard: '电商工作室精装 · 拎包入驻', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/type1.html' },
        { area: '400', type: 'high', standard: '现代极简高标交付 · 视野开阔', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/type1.html' },
        { area: '550', type: 'high', standard: '现代极简高标交付 · 视野开阔', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/type1.html' },
        { area: '1,200', type: 'high', standard: '现代极简高标交付 · 视野开阔', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/type1.html' },
    ];

    let currentCategory = 'all'; 
    let currentPage = 1;          

    function initAdaptiveLayout() {
        const colWidths = MAIN_CONTROL_CONFIG.columns.map(c => c.width).join(' ');
        const alignMap = { left: 'flex-start', center: 'center', right: 'flex-end' };
        const textAlignMap = { left: 'left', center: 'center', right: 'right' };
        
        let alignStyles = '';
        MAIN_CONTROL_CONFIG.columns.forEach(col => {
            const align = col.align || 'center';
            const justify = alignMap[align];
            const textAl = textAlignMap[align];
            
            alignStyles += `
                .col-${col.key} { 
                    text-align: ${textAl} !important; 
                    justify-content: ${justify} !important;
                }
            `;
        });

        const dynamicStyleElement = document.createElement('style');
        dynamicStyleElement.innerHTML = `
            @media (min-width: 769px) {
                .list-header {
                    display: grid !important;
                    grid-template-columns: ${colWidths} !important;
                    gap: 20px;
                    align-items: center;
                }
                .house-row {
                    display: grid !important;
                    grid-template-columns: ${colWidths} !important;
                    gap: 20px;
                    align-items: center;
                }
                .cell-group-left, .cell-group-right, .mobile-inner-row {
                    display: contents !important;
                }
                .grid-cell {
                    display: flex !important;
                    align-items: center !important;
                    width: 100% !important;
                    height: 100% !important;
                }
                ${alignStyles}
            }
        `;
        document.head.appendChild(dynamicStyleElement);

        renderHeader();
    }

    function renderHeader() {
        const headerContainer = document.getElementById('listHeader');
        headerContainer.innerHTML = '';
        MAIN_CONTROL_CONFIG.columns.forEach(col => {
            headerContainer.innerHTML += `<span class="col-${col.key}" style="display: block; width: 100%;">${col.name}</span>`;
        });
    }

    function getFilteredData() {
        return currentCategory === 'all' 
            ? houseData 
            : houseData.filter(h => h.type === currentCategory);
    }

    function renderList() {
        const filtered = getFilteredData();
        const totalItems = filtered.length;
        const itemsPerPage = MAIN_CONTROL_CONFIG.itemsPerPage;
        const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
        
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIndex = (currentPage - 1) * itemsPerPage;
        const pageData = filtered.slice(startIndex, startIndex + itemsPerPage);

        const listContainer = document.getElementById('houseList');
        listContainer.innerHTML = '';
        
        if (pageData.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center;color:#999;padding:60px 0;font-size:14px;width:100%;">暂无对应在租房源记录</div>';
        } else {
            pageData.forEach(item => {
                const statusClass = item.status === 'ready' ? 'ready' : 'booked';
                
                const hasArea = MAIN_CONTROL_CONFIG.columns.some(c => c.key === 'area');
                const hasFloor = MAIN_CONTROL_CONFIG.columns.some(c => c.key === 'floor');
                const hasStandard = MAIN_CONTROL_CONFIG.columns.some(c => c.key === 'standard');
                const hasStatus = MAIN_CONTROL_CONFIG.columns.some(c => c.key === 'status');
                const hasAction = MAIN_CONTROL_CONFIG.columns.some(c => c.key === 'action');

                const itemHtml = `
                    <div class="house-row" onclick="window.open('${item.link}', '_blank')">
                        <div class="cell-group-left">
                            <div class="mobile-inner-row">
                                ${hasArea ? `<div class="grid-cell col-area"><span class="meta-area">${item.area}<span class="unit">㎡</span></span></div>` : ''}
                                ${hasFloor ? `<div class="grid-cell col-floor"><span class="meta-floor">${item.floor}</span></div>` : ''}
                            </div>
                            ${hasStandard ? `<div class="grid-cell col-standard"><div class="meta-standard" title="${item.standard}">${item.standard}</div></div>` : ''}
                        </div>
                        
                        <div class="cell-group-right">
                            ${hasStatus ? `
                                <div class="grid-cell col-status">
                                    <span class="status-badge ${statusClass}">
                                        <span class="dot"></span>
                                        ${item.statusText}
                                    </span>
                                </div>
                            ` : ''}
                            ${hasAction ? `
                                <div class="grid-cell col-action">
                                    <a href="${item.link}" target="_blank" class="action-btn" onclick="event.stopPropagation();">详情</a>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                listContainer.innerHTML += itemHtml;
            });
        }

        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        const paginationContainer = document.getElementById('pagination');
        paginationContainer.innerHTML = '';

        const prevBtn = document.createElement('button');
        prevBtn.className = `page-btn ${currentPage === 1 ? 'disabled' : ''}`;
        prevBtn.innerText = '‹';
        prevBtn.onclick = (e) => {
            e.stopPropagation();
            if (currentPage > 1) {
                currentPage--;
                renderList();
            }
        };
        paginationContainer.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            pageBtn.innerText = i;
            pageBtn.onclick = (e) => {
                e.stopPropagation();
                currentPage = i;
                renderList();
            };
            paginationContainer.appendChild(pageBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = `page-btn ${currentPage === totalPages ? 'disabled' : ''}`;
        nextBtn.innerText = '›';
        nextBtn.onclick = (e) => {
            e.stopPropagation();
            if (currentPage < totalPages) {
                currentPage++;
                renderList();
            }
        };
        paginationContainer.appendChild(nextBtn);
    }

    function filterHouse(category, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = category;
        currentPage = 1; 
        renderList();
    }

    initAdaptiveLayout();
    renderList();
</script>
</body>
</html>
