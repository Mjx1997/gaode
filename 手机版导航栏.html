<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高兼容自适应毛玻璃抽屉导航</title>
    <style>
        /* ==========================================
           1. 基础配置与浅色科技蓝全局变量
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --tech-blue: #0052cc;       /* 核心科技蓝 */
            --glow-blue: #00d2ff;       /* 激活时的点缀亮蓝 */
            /* 💡 核心优化：提高白色不透明度至 0.98，确保在纯白网页上点击时也绝对清晰可见，不再“隐形” */
            --drawer-bg: rgba(255, 255, 255, 0.98); 
            --border-line: rgba(0, 82, 204, 0.15); 
        }

        /* ==========================================
           2. 左侧默认缩略图表按钮
           ========================================== */
        .mini-nav-trigger {
            position: fixed;
            top: 1rem;   
            left: 1rem;
            
            width: auto;
            height: auto;
            padding: 0.8em; 
            
            background: rgba(243, 245, 255, 0.85); 
            backdrop-filter: blur(12px);           
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 82, 204, 0.25); 
            border-radius: 25%; 
            
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* 💡 强行提到极高层级，防止被建站宝盒的其他轮播图或大图挡住 */
            z-index: 2000000002; 
            box-shadow: 0 4px 16px rgba(0, 82, 204, 0.12);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .mini-nav-trigger:hover {
            background: rgba(243, 245, 255, 0.95);
            border-color: var(--tech-blue);
            transform: scale(1.05); 
        }

        .tech-icon-svg {
            width: 1.4em; 
            height: 1.4em;
            fill: none;
            stroke: var(--tech-blue); 
            stroke-width: 3; /* 线条微调加粗，提升浅色下的清晰度 */
            stroke-linecap: round;
            transition: transform 0.3s ease;
        }

        /* 展开状态：点击后图标内部线条转变为“X” */
        .mini-nav-trigger.active .line-top {
            transform: translate(4px, 1px) rotate(45deg);
            transform-origin: left top;
            stroke: var(--tech-blue);
        }
        .mini-nav-trigger.active .line-bottom {
            transform: translate(3px, -1px) rotate(-45deg);
            transform-origin: left bottom;
            stroke: var(--tech-blue);
        }

        /* ==========================================
           3. 左侧滑出全屏抽屉菜单主体
           ========================================== */
        .side-drawer-wrapper {
            position: fixed;
            top: 0;
            left: -100%; /* 默认藏在左边外面 */
            
            width: 80%; 
            max-width: 280px; 
            height: 100vh;
            
            background: var(--drawer-bg);
            backdrop-filter: blur(30px) saturate(140%); 
            -webkit-backdrop-filter: blur(30px) saturate(140%);
            border-right: 1px solid var(--border-line);
            
            /* 💡 核心优化：加深了右侧投影的颜色和范围，让白色的面板在全白背景上滑出时，有明显的阴影边界线 */
            box-shadow: 15px 0 35px rgba(0, 82, 204, 0.12); 
            
            display: flex;
            flex-direction: column;
            padding: 6rem 1.5rem 2rem 1.5rem; /* 增加了顶部的 padding，防止叠在按钮正下方 */
            
            /* 💡 强行提到极高层级，确保遮住大楼网站的内容 */
            z-index: 2000000000; 
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        /* 💡 激活滑出状态：确保能顺利滑到坐标 0 */
        .side-drawer-wrapper.open {
            left: 0 !important;
        }

        /* 品牌标识文字 */
        .drawer-brand {
            font-size: 1.1rem;
            font-weight: bold;
            color: #1a1a1a; 
            letter-spacing: 1px;
            margin-bottom: 2.5rem;
            padding-left: 8px;
            border-left: 3px solid var(--tech-blue); 
        }

        /* 导航栏目菜单列表 */
        .drawer-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* 单个栏目超链接 */
        .drawer-item {
            font-size: 0.95rem;
            color: #333333; /* 颜色加深，保证在浅色网页上清晰 */
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            display: block; /* 确保撑满整行可点击 */
        }

        /* 点击或悬停时的科技高亮 */
        .drawer-item:hover, .drawer-item:active {
            color: var(--tech-blue); 
            background: rgba(0, 82, 204, 0.06); 
            padding-left: 1.4rem; 
        }

        /* 栏目左侧高科技亮蓝光边 */
        .drawer-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            height: 100%;
            background-color: var(--tech-blue);
            transform: scaleY(0); 
            transition: transform 0.2s ease;
        }

        .drawer-item:hover::before, .drawer-item:active::before {
            transform: scaleY(1); 
        }

        /* 底部快捷招商电话 */
        .drawer-footer-phone {
            margin-top: auto; 
            font-size: 0.85rem;
            color: #555555;
            text-decoration: none;
            border-top: 1px solid rgba(0, 82, 204, 0.1);
            padding-top: 1rem;
            display: block;
        }
        
        .drawer-footer-phone span {
            color: var(--tech-blue);
            font-weight: bold;
            display: block;
            margin-top: 0.3rem;
            font-size: 0.95rem;
        }

        /* ==========================================
           4. 全屏幕淡雅背景遮罩层
           ========================================== */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* 💡 遮罩层稍微调深了一点点，点击后后面的大楼内容会微微变暗，更能烘托出滑出的菜单 */
            background: rgba(15, 23, 42, 0.15); 
            backdrop-filter: blur(3px); 
            -webkit-backdrop-filter: blur(3px);
            z-index: 1999999999; /* 刚好在抽屉下面一层 */
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.show {
            display: block !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <div class="mini-nav-trigger" id="nav-trigger-btn" onclick="toggleDrawer()">
        <svg class="tech-icon-svg" viewBox="0 0 24 24">
            <line class="line-top" x1="4" y1="7" x2="20" y2="7" style="transition: transform 0.3s;" />
            <line class="line-bottom" x1="4" y1="17" x2="14" y2="17" style="transition: transform 0.3s;" />
        </svg>
    </div>

    <div class="drawer-overlay" id="menu-shadow-mask" onclick="toggleDrawer()"></div>

    <nav class="side-drawer-wrapper" id="side-drawer-box">
        
        <div class="drawer-brand">科技商务中心</div>

        <div class="drawer-menu">
            <a href="#" class="drawer-item">大楼首页</a>
            <a href="#" class="drawer-item">楼盘简介</a>
            <a href="#" class="drawer-item">招商户型</a>
            <a href="#" class="drawer-item">配套设施</a>
            <a href="#" class="drawer-item">联系我们</a>
        </div>

        <a href="tel:13812345678" class="drawer-footer-phone">
            招商热线咨询：
            <span>📞 13812345678</span>
        </a>
        
    </nav>


    <script>
        function toggleDrawer() {
            const triggerBtn = document.getElementById('nav-trigger-btn');
            const drawerBox = document.getElementById('side-drawer-box');
            const shadowMask = document.getElementById('menu-shadow-mask');

            triggerBtn.classList.toggle('active');
            drawerBox.classList.toggle('open');
            shadowMask.classList.toggle('show');
        }

        const drawerLinks = document.querySelectorAll('.drawer-item, .drawer-footer-phone');
        drawerLinks.forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('nav-trigger-btn').classList.remove('active');
                document.getElementById('side-drawer-box').classList.remove('open');
                document.getElementById('menu-shadow-mask').classList.remove('show');
            });
        });
    </script>

</body>
</html>
