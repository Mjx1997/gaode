<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨越容器限制的自适应导航</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 💡 核心：让正方形根容器全透明，100%填满建站宝盒给你的正方形格子 */
        .portal-nav-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ==========================================
           1. 留在正方形内部的触发按钮（大小完全自适应正方形）
           ========================================== */
        .square-trigger-btn {
            width: 100%;
            height: 100%;
            padding: 15%; /* 使用百分比内边距，不管正方形多大，图标都完美居中且等比 */
            background: rgba(243, 245, 255, 0.85); 
            backdrop-filter: blur(10px);           
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 82, 204, 0.25); 
            border-radius: 25%; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 82, 204, 0.08);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .square-trigger-btn:hover {
            background: rgba(243, 245, 255, 0.95);
            border-color: #0052cc;
            transform: scale(1.05);
        }

        .tech-icon-svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #0052cc; 
            stroke-width: 3; 
            stroke-linecap: round;
        }

        /* ==========================================
           2. 准备被强行发配到外层的全屏抽屉式菜单（重点样式）
           ========================================== */
        .out-side-drawer {
            position: fixed;
            top: 0;
            left: -100%; /* 默认完全藏在屏幕左边外面 */
            width: 80%; 
            max-width: 280px; 
            height: 100vh;
            background: rgba(255, 255, 255, 0.98); /* 极高对比度白，防止隐形 */
            backdrop-filter: blur(30px) saturate(140%); 
            -webkit-backdrop-filter: blur(30px) saturate(140%);
            border-right: 1px solid rgba(0, 82, 204, 0.15);
            box-shadow: 15px 0 35px rgba(0, 82, 204, 0.12); 
            display: flex;
            flex-direction: column;
            padding: 6rem 1.5rem 2rem 1.5rem; 
            z-index: 2147483647; /* 💡 浏览器能识别的最高绝对层级，绝对骑在所有人头上 */
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        /* 激活时强制弹出 */
        .out-side-drawer.open {
            left: 0 !important;
        }

        .drawer-brand {
            font-size: 1.1rem;
            font-weight: bold;
            color: #1a1a1a; 
            letter-spacing: 1px;
            margin-bottom: 2.5rem;
            padding-left: 8px;
            border-left: 3px solid #0052cc; 
        }

        .drawer-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .drawer-item {
            font-size: 0.95rem;
            color: #333333; 
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            display: block;
        }

        .drawer-item:hover, .drawer-item:active {
            color: #0052cc; 
            background: rgba(0, 82, 204, 0.06); 
            padding-left: 1.4rem; 
        }

        /* 底部招商热线 */
        .drawer-footer-phone {
            margin-top: auto; 
            font-size: 0.85rem;
            color: #555555;
            text-decoration: none;
            border-top: 1px solid rgba(0, 82, 204, 0.1);
            padding-top: 1rem;
            display: block;
        }
        
        .drawer-footer-phone span {
            color: #0052cc;
            font-weight: bold;
            display: block;
            margin-top: 0.3rem;
            font-size: 0.95rem;
        }

        /* ==========================================
           3. 准备被发配到外层的全局轻量背景遮罩
           ========================================== */
        .out-side-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.15); 
            backdrop-filter: blur(3px); 
            -webkit-backdrop-filter: blur(3px);
            z-index: 2147483646; /* 刚好在抽屉大面板下面一层 */
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .out-side-overlay.show {
            display: block !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <div class="portal-nav-container">
        <div class="square-trigger-btn" id="trigger-action-btn" onclick="openTechMenu()">
            <svg class="tech-icon-svg" viewBox="0 0 24 24">
                <line x1="4" y1="7" x2="20" y2="7" />
                <line x1="4" y1="12" x2="16" y2="12" />
                <line x1="4" y1="17" x2="20" y2="17" />
            </svg>
        </div>
    </div>

    <div class="out-side-overlay" id="portal-shadow-mask" onclick="closeTechMenu()"></div>

    <nav class="out-side-drawer" id="portal-drawer-box">
        <div class="drawer-brand">科技商务中心</div>

        <div class="drawer-menu">
            <a href="#" class="drawer-item">大楼首页</a>
            <a href="#" class="drawer-item">楼盘简介</a>
            <a href="#" class="drawer-item">招商户型</a>
            <a href="#" class="drawer-item">配套设施</a>
            <a href="#" class="drawer-item">联系我们</a>
        </div>

        <a href="tel:13812345678" class="drawer-footer-phone">
            招商热线咨询：
            <span>📞 13812345678</span>
        </a>
    </nav>


    <script>
        // 当页面一旦加载完毕，立刻执行“越狱”和“寄生”
        window.addEventListener('DOMContentLoaded', (event) => {
            const mask = document.getElementById('portal-shadow-mask');
            const drawer = document.getElementById('portal-drawer-box');
            
            // 💡 绝招：把这两个本来塞在正方形狭小盒子里的元素，直接强行塞到整张网页的最外层 <body> 里
            if (mask && drawer) {
                document.body.appendChild(mask);
                document.body.appendChild(drawer);
            }
        });

        // 按钮点击打开逻辑
        function openTechMenu() {
            document.getElementById('portal-drawer-box').classList.add('open');
            document.getElementById('portal-shadow-mask').classList.add('show');
        }

        // 关闭菜单逻辑
        function closeTechMenu() {
            document.getElementById('portal-drawer-box').classList.remove('open');
            document.getElementById('portal-shadow-mask').classList.remove('show');
        }

        // 优化体验：点击菜单内的超链接，菜单自动收回
        const allLinks = document.querySelectorAll('.drawer-item, .drawer-footer-phone');
        allLinks.forEach(link => {
            link.addEventListener('click', closeTechMenu);
        });
    </script>

</body>
</html>
