<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Office Leasing Navigation</title>

    <style>
        /* ==========================================================================
           【 核心配置区 】- 后期无论是调间距还是改【超链接】，只改这里即可 🔴
           ========================================================================== */
        :root {
            /* 1. 后期自行设置超链接功能（直接在这里修改双引号里面的网址或锚点） */
            --url-home: "https://www.hdcentury.com/";             /* 🏠 楼盘首页 的跳转链接 */
            --url-space: "https://www.hdcentury.com/details.html";           /* 🏢 房源租赁 的跳转链接 */
            --url-service: "https://www.hdcentury.com/Location.html";       /* 🛠️ 企业服务 的跳转链接 */
            --url-about: "https://www.hdcentury.com/Contact.html";           /* ℹ️ 关于我们 的跳转链接 */
            --url-phone: "tel:18163315451"; /* 📞 底部预约看房的电话（tel:后面跟你的真实电话） */

            /* 2. 悬浮主按钮的位置控制 */
            --btn-left: 6px;                /* 👈 主按钮距离屏幕最左侧的距离 */
            --btn-top: 6px;                /* 👆 主按钮距离屏幕顶部的距离 */
            --btn-zindex: 999999;           /* 突破限制的层级 */

            /* 3. 抽屉宽度配置 */
            --drawer-width: 55vw;           /* 导航栏展开时占屏幕的宽度 */

            /* 4. 侧滑抽屉内部留白微调 */
            --drawer-padding-left: 12px;    /* 👈 滑出页面内的文字图标距离左边的边距 */
            --drawer-padding-right: 12px;   /* 👉 滑出页面内的右边距 */
            --drawer-padding-top: 70px;    /* 👆 滑出页面内的顶边距 */

            /* 5. 颜色配置 (大厂现代商业地产风格) */
            --theme-color: #2563eb;         /* 主题高亮色/大厂蓝 */
            --text-main: #334155;           /* 菜单文字颜色 */
            --text-active: #2563eb;         /* 菜单选中时的文字颜色 */
            --bg-drawer: #ffffff;           /* 弹出菜单的背景颜色 */
            --bg-item-active: #f1f5f9;      /* 菜单选中/点击时的背景色 */
            
            /* 6. 字体配置 */
            --font-size-menu: 15px;         
            --font-weight-menu: 500;        
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* ==========================================================================
           【 核心样式区 】- 已全面加回 !important 强力盾牌，防宝盒干扰 🛡️
           ========================================================================== */
        
        /* 悬浮主按钮 - 完美支持极小或负数左边距，强制悬浮 */
        .office-nav-trigger {
            position: fixed !important;    /* 🔴 强行置顶悬浮 */
            top: var(--btn-top) !important;
            left: var(--btn-left) !important; 
            z-index: var(--btn-zindex) !important;
            width: 44px !important;
            height: 44px !important;
            border-radius: 12px !important;
            background: rgba(255, 255, 255, 0.85) !important;
            border: 1px solid rgba(241, 245, 249, 0.8) !important;
            box-shadow: -2px 4px 12px rgba(15, 23, 42, 0.08) !important; 
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s !important;
            user-select: none !important;
            padding: 0 !important;
        }

        .office-nav-trigger:active {
            transform: scale(0.95) translateY(1px) !important;
            background: rgba(241, 245, 249, 0.95) !important;
        }

        /* 当菜单打开时，主按钮的变虚样式 */
        .office-nav-trigger.is-open-state {
            background: rgba(255, 255, 255, 0.4) !important;
            box-shadow: none !important;
            border-color: transparent !important;
        }

        /* 页面内独立的关闭按钮 */
        .drawer-close-btn {
            position: absolute !important;
            top: 14px !important;
            right: 14px !important;
            width: 32px !important;
            height: 32px !important;
            border-radius: 50% !important;
            background: #f1f5f9 !important;
            border: none !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            color: #64748b !important;
            transition: all 0.2s ease !important;
            padding: 0 !important;
        }

        .drawer-close-btn:active {
            transform: scale(0.9) !important;
            background: #e2e8f0 !important;
            color: #334155 !important;
        }

        /* 背景遮罩 */
        .office-nav-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: calc(var(--btn-zindex) - 1) !important;
            background: rgba(15, 23, 42, 0.3) !important;
            backdrop-filter: blur(4px) !important;
            -webkit-backdrop-filter: blur(4px) !important;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease !important;
        }

        .office-nav-overlay.is-active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        /* 侧滑抽屉 */
        .office-nav-drawer {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: var(--drawer-width) !important;
            height: 100vh !important;
            z-index: var(--btn-zindex) !important;
            background: var(--bg-drawer) !important;
            box-shadow: 8px 0 32px rgba(15, 23, 42, 0.06) !important;
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
            display: flex !important;
            flex-direction: column !important;
            padding: var(--drawer-padding-top) var(--drawer-padding-right) 24px var(--drawer-padding-left) !important;
            box-sizing: border-box !important;
        }

        .office-nav-drawer.is-active {
            transform: translateX(0) !important;
        }

        /* 导航列表 */
        .office-menu-list {
            list-style: none !important;
            padding: 0 !important;
            margin: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 6px !important;
        }

        .office-menu-item {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            padding: 12px 10px !important;
            color: var(--text-main) !important;
            text-decoration: none !important;
            font-family: var(--font-family) !important;
            font-size: var(--font-size-menu) !important;
            font-weight: var(--font-weight-menu) !important;
            border-radius: 8px !important;
            transition: all 0.2s ease !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        .office-menu-item:active, 
        .office-menu-item.current {
            background: var(--bg-item-active) !important;
            color: var(--text-active) !important;
        }

        .office-menu-item svg {
            stroke: #94a3b8 !important;
            transition: stroke 0.2s ease !important;
            flex-shrink: 0 !important;
        }

        .office-menu-item:active svg,
        .office-menu-item.current svg {
            stroke: var(--text-active) !important;
        }

        /* 底部转换动作条 */
        .office-nav-footer {
            margin-top: auto !important;
            border-top: 1px solid #f1f5f9 !important;
            padding-top: 16px !important;
        }

        .btn-call {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 6px !important;
            width: 100% !important;
            padding: 12px 0 !important;
            background: var(--theme-color) !important;
            color: #ffffff !important;
            text-decoration: none !important;
            font-family: var(--font-family) !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            border-radius: 10px !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2) !important;
            -webkit-tap-highlight-color: transparent !important;
        }
        .btn-call svg {
            stroke: #ffffff !important;
            flex-shrink: 0 !important;
        }
    </style>
</head>
<body>

    <button class="office-nav-trigger" id="navTrigger" aria-label="切换菜单">
        <svg id="menuIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
    </button>

    <div class="office-nav-overlay" id="navOverlay"></div>

    <nav class="office-nav-drawer" id="navDrawer">
        
        <button class="drawer-close-btn" id="drawerCloseBtn" aria-label="关闭菜单">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <ul class="office-menu-list">
            <li>
                <a id="linkHome" href="#" class="office-menu-item current">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="9" y1="22" x2="9" y2="16"></line><line x1="15" y1="22" x2="15" y2="16"></line><line x1="9" y1="16" x2="15" y2="16"></line><path d="M8 6h2v2H8V6zm4 0h2v2h-2V6zm4 0h2v2h-2V6zm-8 4h2v2H8v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm-8 4h2v2H8v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2z"></path></svg>
                    <span>楼盘首页</span>
                </a>
            </li>
            <li>
                <a id="linkSpace" href="#" class="office-menu-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="5"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                    <span>房源租赁</span>
                </a>
            </li>
            <li>
                <a id="linkService" href="#" class="office-menu-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                    <span>地理位置</span>
                </a>
            </li>
            <li>
                <a id="linkAbout" href="#" class="office-menu-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    <span>联系我们</span>
                </a>
            </li>
        </ul>

        <div class="office-nav-footer">
            <a id="linkPhone" href="#" class="btn-call">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2v3a2 2 0 0 1 1.51 1.96 12.06 12.06 0 0 0 .5 2.28 2 2 0 0 1-.51 2.15l-1.24 1.24a16 16 0 0 0 6 6l1.24-1.24a2 2 0 0 1 2.15-.51 12.07 12.07 0 0 0 2.28.5A2 2 0 0 1 22 16.92z"></path></svg>
                <span>预约看房</span>
            </a>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 获取在顶层配置的 CSS 变量超链接
            const rootStyles = getComputedStyle(document.documentElement);
            
            // 智能绑定超链接到对应的 A 标签上
            document.getElementById('linkHome').href = rootStyles.getPropertyValue('--url-home').trim().replace(/['"]/g, '');
            document.getElementById('linkSpace').href = rootStyles.getPropertyValue('--url-space').trim().replace(/['"]/g, '');
            document.getElementById('linkService').href = rootStyles.getPropertyValue('--url-service').trim().replace(/['"]/g, '');
            document.getElementById('linkAbout').href = rootStyles.getPropertyValue('--url-about').trim().replace(/['"]/g, '');
            document.getElementById('linkPhone').href = rootStyles.getPropertyValue('--url-phone').trim().replace(/['"]/g, '');

            // 基础控制核心结构
            const trigger = document.getElementById('navTrigger');
            const overlay = document.getElementById('navOverlay');
            const drawer = document.getElementById('navDrawer');
            const closeBtn = document.getElementById('drawerCloseBtn');

            let isOpen = false;

            function openMenu() {
                isOpen = true;
                trigger.classList.add('is-open-state'); 
                overlay.classList.add('is-active');
                drawer.classList.add('is-active');
            }

            function closeMenu() {
                if (!isOpen) return; 
                isOpen = false;
                trigger.classList.remove('is-open-state'); 
                overlay.classList.remove('is-active');
                drawer.classList.remove('is-active');
            }

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isOpen) { closeMenu(); } else { openMenu(); }
            });

            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeMenu();
            });

            overlay.addEventListener('click', closeMenu);

            const menuItems = document.querySelectorAll('.office-menu-item');
            menuItems.forEach(item => {
                item.addEventListener('click', () => {
                    menuItems.forEach(i => i.classList.remove('current'));
                    item.classList.add('current');
                    closeMenu();
                });
            });
        });
    </script>
</body>
</html>
