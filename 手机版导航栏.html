<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Office Leasing Navigation</title>

    <style>
        /* ==========================================================================
           【 核心配置区 】- 响应你的需求，直接在这里调整主按钮的左边距
           ========================================================================== */
        :root {
            /* 1. 悬浮主按钮的位置控制（重点修改这里 🔴） */
            --btn-left: 5px;                /* 👈 主按钮距离屏幕最左侧的距离（原为16px，已大幅缩小，你可以改成 0px 彻底贴边） */
            --btn-top: 5px;                /* 👆 主按钮距离屏幕顶部的距离 */
            --btn-zindex: 999999;           /* 突破限制的层级 */

            /* 2. 抽屉宽度配置 */
            --drawer-width: 55vw;           /* 导航栏展开时占屏幕的宽度 */

            /* 3. 侧滑抽屉内部留白微调 */
            --drawer-padding-left: 12px;    /* 👈 滑出页面内的文字图标距离左边的边距 */
            --drawer-padding-right: 12px;   /* 👉 滑出页面内的右边距 */
            --drawer-padding-top: 70px;    /* 👆 滑出页面内的顶边距 */

            /* 4. 颜色配置 (大厂现代商业地产风格) */
            --theme-color: #2563eb;         /* 主题高亮色/大厂蓝 */
            --text-main: #334155;           /* 菜单文字颜色 */
            --text-active: #2563eb;         /* 菜单选中时的文字颜色 */
            --bg-drawer: #ffffff;           /* 弹出菜单的背景颜色 */
            --bg-item-active: #f1f5f9;      /* 菜单选中/点击时的背景色 */
            
            /* 5. 字体配置 */
            --font-size-menu: 15px;         
            --font-weight-menu: 500;        
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* ==========================================================================
           【 核心样式区 】
           ========================================================================== */
        
        /* 悬浮主按钮 - 完美支持极小或负数左边距 */
        .office-nav-trigger {
            position: fixed;
            top: var(--btn-top);
            left: var(--btn-left) !important; /* 强制覆盖建站宝盒可能存在的嵌套样式 */
            z-index: var(--btn-zindex);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(241, 245, 249, 0.8);
            box-shadow: -2px 4px 12px rgba(15, 23, 42, 0.08); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
            user-select: none;
            padding: 0;
        }

        .office-nav-trigger:active {
            transform: scale(0.95) translateY(1px);
            background: rgba(241, 245, 249, 0.95);
        }

        /* 当菜单打开时，主按钮的变虚样式 */
        .office-nav-trigger.is-open-state {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: none;
            border-color: transparent;
        }

        /* 页面内独立的关闭按钮 */
        .drawer-close-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f1f5f9;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #64748b;
            transition: all 0.2s ease;
            padding: 0;
        }

        .drawer-close-btn:active {
            transform: scale(0.9);
            background: #e2e8f0;
            color: #334155;
        }

        /* 背景遮罩 */
        .office-nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: calc(var(--btn-zindex) - 1);
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .office-nav-overlay.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 侧滑抽屉 */
        .office-nav-drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--drawer-width);
            height: 100vh;
            z-index: var(--btn-zindex);
            background: var(--bg-drawer);
            box-shadow: 8px 0 32px rgba(15, 23, 42, 0.06);
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: var(--drawer-padding-top) var(--drawer-padding-right) 24px var(--drawer-padding-left);
            box-sizing: border-box;
        }

        .office-nav-drawer.is-active {
            transform: translateX(0);
        }

        /* 导航列表 */
        .office-menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .office-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 10px;
            color: var(--text-main);
            text-decoration: none;
            font-family: var(--font-family);
            font-size: var(--font-size-menu);
            font-weight: var(--font-weight-menu);
            border-radius: 8px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .office-menu-item:active, 
        .office-menu-item.current {
            background: var(--bg-item-active);
            color: var(--text-active);
        }

        .office-menu-item svg {
            stroke: #94a3b8;
            transition: stroke 0.2s ease;
            flex-shrink: 0;
        }

        .office-menu-item:active svg,
        .office-menu-item.current svg {
            stroke: var(--text-active);
        }

        /* 底部转换动作条 */
        .office-nav-footer {
            margin-top: auto;
            border-top: 1px solid #f1f5f9;
            padding-top: 16px;
        }

        .btn-call {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 12px 0;
            background: var(--theme-color);
            color: #ffffff;
            text-decoration: none;
            font-family: var(--font-family);
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            -webkit-tap-highlight-color: transparent;
        }
        .btn-call svg {
            stroke: #ffffff;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <button class="office-nav-trigger" id="navTrigger" aria-label="切换菜单">
        <svg id="menuIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
    </button>

    <div class="office-nav-overlay" id="navOverlay"></div>

    <nav class="office-nav-drawer" id="navDrawer">
        
        <button class="drawer-close-btn" id="drawerCloseBtn" aria-label="关闭菜单">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <ul class="office-menu-list">
            <li>
                <a href="#home" class="office-menu-item current">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="9" y1="22" x2="9" y2="16"></line><line x1="15" y1="22" x2="15" y2="16"></line><line x1="9" y1="16" x2="15" y2="16"></line><path d="M8 6h2v2H8V6zm4 0h2v2h-2V6zm4 0h2v2h-2V6zm-8 4h2v2H8v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm-8 4h2v2H8v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2z"></path></svg>
                    <span>楼盘首页</span>
                </a>
            </li>
            <li>
                <a href="#space" class="office-menu-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                    <span>房源租赁</span>
                </a>
            </li>
            <li>
                <a href="#service" class="office-menu-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                    <span>企业服务</span>
                </a>
            </li>
            <li>
                <a href="#about" class="office-menu-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    <span>关于我们</span>
                </a>
            </li>
        </ul>

        <div class="office-nav-footer">
            <a href="tel:400-123-4567" class="btn-call">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2v3a2 2 0 0 1 1.51 1.96 12.06 12.06 0 0 0 .5 2.28 2 2 0 0 1-.51 2.15l-1.24 1.24a16 16 0 0 0 6 6l1.24-1.24a2 2 0 0 1 2.15-.51 12.07 12.07 0 0 0 2.28.5A2 2 0 0 1 22 16.92z"></path></svg>
                <span>预约看房</span>
            </a>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const trigger = document.getElementById('navTrigger');
            const overlay = document.getElementById('navOverlay');
            const drawer = document.getElementById('navDrawer');
            const closeBtn = document.getElementById('drawerCloseBtn');

            let isOpen = false;

            function openMenu() {
                isOpen = true;
                trigger.classList.add('is-open-state'); 
                overlay.classList.add('is-active');
                drawer.classList.add('is-active');
            }

            function closeMenu() {
                if (!isOpen) return; 
                isOpen = false;
                trigger.classList.remove('is-open-state'); 
                overlay.classList.remove('is-active');
                drawer.classList.remove('is-active');
            }

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isOpen) { closeMenu(); } else { openMenu(); }
            });

            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeMenu();
            });

            overlay.addEventListener('click', closeMenu);

            const menuItems = document.querySelectorAll('.office-menu-item');
            menuItems.forEach(item => {
                item.addEventListener('click', () => {
                    menuItems.forEach(i => i.classList.remove('current'));
                    item.classList.add('current');
                    closeMenu();
                });
            });
        });
    </script>
</body>
</html>
