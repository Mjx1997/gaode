<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛玻璃科技感左侧抽屉导航</title>
    <style>
        /* ==========================================
           1. 基础样式与科技蓝全局变量
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            /* 💡 注意：这里为了测试毛玻璃透明效果，放了一个渐变背景。
               放到建站宝盒里后，导航栏会自动透出你原本网页的背景，非常漂亮！ */
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0052cc 100%);
            height: 2000px; 
        }

        :root {
            --tech-blue: #0052cc;       /* 💡 核心科技蓝（商务、沉稳） */
            --glow-blue: #00d2ff;       /* 💡 点缀亮蓝（用于高科技微光） */
            /* 💡 核心修改：大幅降低背景不透明度（0.55），留给毛玻璃完美的透光空间 */
            --drawer-bg: rgba(15, 23, 42, 0.55); 
            --border-line: rgba(0, 82, 204, 0.25); /* 💡 科技感微光边框线 */
        }

        /* ==========================================
           2. 左侧默认缩略图表容器（已改为轻量毛玻璃）
           ========================================== */
        .mini-nav-trigger {
            position: fixed;
            top: 16px;
            left: 16px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.06); /* 💡 极其轻薄的白色半透 */
            backdrop-filter: blur(10px);           /* 💡 毛玻璃效果 */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15); /* 柔和白边 */
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10005;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        /* 悬停在缩略图标上时稍微亮一点 */
        .mini-nav-trigger:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--glow-blue);
        }

        /* 纯CSS科技感方块缩略图标 */
        .tech-icon {
            position: relative;
            width: 18px;
            height: 14px;
        }

        .tech-icon::before, .tech-icon::after {
            content: '';
            position: absolute;
            left: 0;
            height: 2px;
            background-color: #ffffff;
            border-radius: 2px;
            transition: transform 0.3s ease, width 0.3s ease, background-color 0.3s ease;
        }

        .tech-icon::before {
            top: 2px;
            width: 18px;
        }

        .tech-icon::after {
            bottom: 2px;
            width: 12px;
        }

        /* 当点击展开后，左侧缩略图标无缝变成关闭“X” */
        .mini-nav-trigger.active .tech-icon::before {
            transform: translateY(4px) rotate(45deg);
            width: 16px;
            background-color: var(--glow-blue);
        }

        .mini-nav-trigger.active .tech-icon::after {
            transform: translateY(-4px) rotate(-45deg);
            width: 16px;
            background-color: var(--glow-blue);
        }


        /* ==========================================
           3. 左侧滑出全屏抽屉菜单（高级毛玻璃主体）
           ========================================== */
        .side-drawer-wrapper {
            position: fixed;
            top: 0;
            left: -100%; 
            width: 280px; 
            height: 100vh;
            background: var(--drawer-bg);
            /* 💡 核心引入：大厂超酷的物理重度毛玻璃滤镜 */
            backdrop-filter: blur(24px) saturate(120%); 
            -webkit-backdrop-filter: blur(24px) saturate(120%);
            border-right: 1px solid var(--border-line);
            box-shadow: 15px 0 40px rgba(0, 0, 0, 0.2); /* 减弱了阴影，靠透明度拉开层次 */
            display: flex;
            flex-direction: column;
            padding: 80px 24px 40px 24px; 
            z-index: 10002;
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        /* 激活状态：从左侧优雅滑入 */
        .side-drawer-wrapper.open {
            left: 0;
        }

        /* 侧边栏大厂风品牌标识 */
        .drawer-brand {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 40px;
            padding-left: 8px;
            border-left: 3px solid var(--tech-blue); 
            text-shadow: 0 2px 4px rgba(0,0,0,0.3); /* 防止背景太亮时字看不清 */
        }

        /* 导航栏目菜单列表 */
        .drawer-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 单个栏目链接 */
        .drawer-item {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        /* 点击或悬停时的科技感 */
        .drawer-item:hover, .drawer-item:active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1); /* 改为白色泛光半透底 */
            padding-left: 22px; 
        }

        /* 栏目左侧暗藏的高科技亮蓝光边 */
        .drawer-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            height: 100%;
            background-color: var(--glow-blue);
            box-shadow: 0 0 8px var(--glow-blue);
            transform: scaleY(0); 
            transition: transform 0.2s ease;
        }

        .drawer-item:hover::before, .drawer-item:active::before {
            transform: scaleY(1); 
        }

        /* 底部快捷招商电话 */
        .drawer-footer-phone {
            margin-top: auto; 
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
            transition: color 0.3s;
        }
        
        .drawer-footer-phone span {
            color: var(--glow-blue);
            font-weight: 500;
            display: block;
            margin-top: 4px;
            text-shadow: 0 0 6px rgba(0, 210, 255, 0.3);
        }

        /* ==========================================
           4. 全屏幕遮罩层
           ========================================== */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(4, 7, 13, 0.25); /* 降低了遮罩层颜色，更显通透 */
            backdrop-filter: blur(2px); 
            -webkit-backdrop-filter: blur(2px);
            z-index: 10001;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.show {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="mini-nav-trigger" id="nav-trigger-btn" onclick="toggleDrawer()">
        <div class="tech-icon"></div>
    </div>

    <div class="drawer-overlay" id="menu-shadow-mask" onclick="toggleDrawer()"></div>

    <nav class="side-drawer-wrapper" id="side-drawer-box">
        
        <div class="drawer-brand">科技商务中心</div>

        <div class="drawer-menu">
            <a href="#" class="drawer-item">大楼首页</a>
            <a href="#" class="drawer-item">楼盘简介</a>
            <a href="#" class="drawer-item">招商户型</a>
            <a href="#" class="drawer-item">配套设施</a>
            <a href="#" class="drawer-item">联系我们</a>
        </div>

        <a href="tel:13812345678" class="drawer-footer-phone">
            招商热线咨询：
            <span>📞 13812345678</span>
        </a>
        
    </nav>


    <script>
        function toggleDrawer() {
            const triggerBtn = document.getElementById('nav-trigger-btn');
            const drawerBox = document.getElementById('side-drawer-box');
            const shadowMask = document.getElementById('menu-shadow-mask');

            triggerBtn.classList.toggle('active');
            drawerBox.classList.toggle('open');
            shadowMask.classList.toggle('show');
        }

        const drawerLinks = document.querySelectorAll('.drawer-item, .drawer-footer-phone');
        drawerLinks.forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('nav-trigger-btn').classList.remove('active');
                document.getElementById('side-drawer-box').classList.remove('open');
                document.getElementById('menu-shadow-mask').classList.remove('show');
            });
        });
    </script>

</body>
</html>
