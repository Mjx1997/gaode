<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>户型介绍模块</title>
    <style>
        /* 基础重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 外部大容器：背景透明，四周留白24px，自适应响应式 */
        .apartment-section {
            width: 100%;
            background-color: transparent; /* 背景保持透明 */
            padding: 24px; /* 四周固定 24px 间距 */
            display: grid;
            /* 自动网格布局：随窗口拖动自动换行 */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px; /* 卡片之间的间距 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 单个卡片样式 */
        .apartment-card {
            background-color: #ffffff; /* 卡片自身为白色背景 */
            border-radius: 16px; /* 卡片圆角 */
            border: 1px solid #eaeaea; /* 纯净无阴影，改用极淡边框防止纯白背景下无法分辨 */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative; /* 用于手机端撑满超链接点击区域 */
        }

        /* 卡片头部图片区域 */
        .card-header {
            position: relative;
            width: 100%;
            padding-top: 75%; /* 4:3 黄金比例 */
        }

        .card-header img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 顶部左上角状态标签 */
        .card-tag {
            position: absolute;
            top: 16px;
            left: 16px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            border-radius: 20px;
            z-index: 10;
        }

        .tag-teal { background-color: #26c2cb; }   /* 户型一：青色 */
        .tag-blue { background-color: #0066ff; }   /* 户型二：蓝色 */
        .tag-orange { background-color: #ff5500; } /* 户型三：橙色 */

        /* 卡片文字内容包裹区 */
        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* 标题与价格的父级容器：实现左右对齐 */
        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }

        /* 标题样式 */
        .card-title {
            font-size: 20px;
            color: #1a1a1a;
            font-weight: bold;
        }

        /* 💡 价格区域样式：已经帮你修改为淡蓝色（与按钮一致的商务科技蓝） */
        .card-price {
            font-size: 16px;
            color: #0052cc; 
            font-weight: bold;
            white-space: nowrap; /* 防止价格换行 */
            flex-shrink: 0;
        }

        /* 简介 */
        .card-description {
            font-size: 14px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 20px;
            min-height: 44px; /* 保持高度对齐 */
        }

        /* 参数信息行 */
        .card-specs {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .spec-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #333333;
        }

        .spec-item svg {
            color: #0052cc; 
            flex-shrink: 0;
        }

        /* 2D平面图外层蓝色容器 */
        .floorplan-container {
            background-color: #f3f5ff; /* 淡蓝色背景 */
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 20px;
            margin-top: auto; /* 将平面图固定压在卡片底部 */
        }

        .floorplan-title {
            font-size: 12px;
            color: #666666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        /* 固定大小的长方形区域，让图片自适应填充 */
        .floorplan-img-wrapper {
            width: 100%;
            height: 130px; /* 固定长方形区域高度 */
            background-color: #ffffff;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 6px;
        }

        .floorplan-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保持图片原本比例缩放在长方形框内 */
        }

        /* 查看详情按钮 */
        .details-btn {
            width: 100%;
            background-color: #eef2ff;
            color: #0052cc;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .details-btn:hover {
            background-color: #e0e7ff;
        }


        /* ==========================================================================
           💡 手机端/移动端 专属样式 (当屏幕宽度小于 768px 时自动生效)
           ========================================================================== */
        @media (max-width: 768px) {
            /* 1. 隐藏指定的项目：面积/容量、2D平面图、传统按钮 */
            .card-specs, 
            .floorplan-container, 
            .details-btn {
                display: none !important;
            }

            /* 2. 优化卡片布局 */
            .card-description {
                margin-bottom: 0px;
                min-height: auto; 
            }

            /* 3. 手机端全卡片点击超链接 */
            .apartment-card {
                cursor: pointer;
            }
            
            .details-btn {
                display: block !important; 
                position: static;
                background: none !important;
                padding: 0 !important;
                height: 0 !important;
                width: 0 !important;
                text-indent: -9999px; 
            }

            .details-btn::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 5; 
            }
        }
    </style>
</head>
<body>

<div class="apartment-section">

    <div class="apartment-card">
        <div class="card-header">

            <a href="" target="_blank" class="details-btn" id="link-1">查看详情</a>

    </div>

    <div class="apartment-card">
        <div class="card-header">
            <span class="card-tag tag-blue" id="tag-2"></span>
            <img src="" alt="户型大图" id="img-2">
        </div>
        <div class="card-body">
            <div class="title-row">
                <h3 class="card-title" id="title-2"></h3>
                <span class="card-price" id="price-2"></span> 
            </div>
            <p class="card-description" id="desc-2"></p>
            
            <div class="card-specs">
                <div class="spec-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 22L2 2v20z"/></svg>
                    <span id="spec-2-1"></span>
                </div>
                <div class="spec-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span id="spec-2-2"></span>
                </div>
            </div>

            <div class="floorplan-container">
                <div class="floorplan-title">2D 平面简图</div>
                <div class="floorplan-img-wrapper">
                    <img src="" alt="平面图" id="floorplan-2">
                </div>
            </div>

            <a href="" target="_blank" class="details-btn" id="link-2">查看详情</a>
        </div>
    </div>

    <div class="apartment-card">
        <div class="card-header">
            <span class="card-tag tag-orange" id="tag-3"></span>
            <img src="" alt="户型大图" id="img-3">
        </div>
        <div class="card-body">
            <div class="title-row">
                <h3 class="card-title" id="title-3"></h3>
                <span class="card-price" id="price-3"></span> 
            </div>
            <p class="card-description" id="desc-3"></p>
            
            <div class="card-specs">
                <div class="spec-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 22L2 2v20z"/></svg>
                    <span id="spec-3-1"></span>
                </div>
                <div class="spec-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="9" y1="22" x2="9" y2="16"/><line x1="15" y1="22" x2="15" y2="16"/><line x1="9" y1="16" x2="15" y2="16"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/></svg>
                    <span id="spec-3-2"></span>
                </div>
            </div>

            <div class="floorplan-container">
                <div class="floorplan-title">2D 平面简图</div>
                <div class="floorplan-img-wrapper">
                    <img src="" alt="平面图" id="floorplan-3">
                </div>
            </div>

            <a href="" target="_blank" class="details-btn" id="link-3">查看详情</a>
        </div>
    </div>

</div>


<script>
    const apartmentData = {
        // ------------------ 户型一配置 ------------------
        card1: {
            tag: "拎包入住",
            title: "精装修小户型",
            price: "¥ 2.5 元/m²/天",  // 📝 价格修改处
            desc: "适合初创团队与个人工作室，高标准装修配套。",
            spec1: "面积：85 - 120 m²",
            spec2: "容量：1 - 10 人",

            // 📝 替换下方引号内的网址为您的 FTP 2D平面图地址

            // 📝 这里的链接在手机端会作为【全卡片点击跳转】的地址，电脑端作为【查看详情】按钮的地址
            linkUrl: "https://www.baidu.com/"

        card2: {
            tag: "独立经理室",

            spec2: "容量：10 - 30 人",

            linkUrl: "https://www.baidu.com/"
        },

        // ------------------ 户型三配置 ------------------
        card3: {
            tag: "专属电梯厅",
            title: "定制化大面积 (整层)",
            price: "¥ 4.5 元/m²/天",  // 📝 价格修改处
            desc: "全景总部空间，支持品牌定制化装修与私密门禁。",
            spec1: "面积：1200 - 2400 m²",
            spec2: "特色：企业总部挂牌",
            imgUrl: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=600&q=80",
            floorplanUrl: "https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=400&q=80",
            linkUrl: "https://www.baidu.com/"
        }
    };

    // 自动将数据渲染到页面中，请勿修改下方渲染逻辑代码
    function renderCard(id, data) {
        document.getElementById(`tag-${id}`).innerText = data.tag;
        document.getElementById(`title-${id}`).innerText = data.title;
        document.getElementById(`price-${id}`).innerText = data.price; 
        document.getElementById(`desc-${id}`).innerText = data.desc;
        document.getElementById(`spec-${id}-1`).innerText = data.spec1;
        document.getElementById(`spec-${id}-2`).innerText = data.spec2;
        document.getElementById(`img-${id}`).src = data.imgUrl;
        document.getElementById(`floorplan-${id}`).src = data.floorplanUrl;
        document.getElementById(`link-${id}`).href = data.linkUrl;
    }
    renderCard(1, apartmentData.card1);
    renderCard(2, apartmentData.card2);
    renderCard(3, apartmentData.card3);
</script>

</body>
</html>
