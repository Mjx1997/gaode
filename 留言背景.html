<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>自适应表单背景容器 - 空间数字座舱</title>
    <style>
        /* ====================================================
           💡【全能配置中心】在这里修改一切，全页面无缝同步
           ==================================================== */
        :root {
            /* 📝 1. 顶部标题与简介文字配置 (在这里直接改字) */
            --text-title: "意向留言";                                 /* 主标题 */
            --text-subtitle: "留下您的联系方式，我们的招商顾问将在2小时内与您联系"; /* 副标题 */


            /* 📐 2. 核心自适应与留白控制台 (【重点看这里】) */
            --container-min-height: 550px; /* 【核心保障】：大背景的最小高度！确保中间没数据时依然能撑开，可根据表单长度随时改大或改小 */
            
            --page-margin: 0px;            /* 整个大背景与嵌入窗口边缘的【外边距】（做背景推荐设为0，全贴合） */
            --container-padding-top: 24px; /* 内部主标题距离顶部的【上内边距】 */
            --container-padding-x: 18px;   /* 内部内容距离左右两侧线条的【左右内边距】 */
            --title-gap: 8px;              /* 主标题与副标题之间的【上下间距】 */
            --content-top-gap: 24px;       /* 副标题与你下方表单内容之间的【安全空隙距离】 */


            /* 🎨 3. 视觉与特效控制台 (现代大厂微光质感) */
            --bg-title-color: #1d1d1f;     /* 主标题文字颜色（科技黑） */
            --bg-subtitle-color: #646a73;  /* 副标题文字颜色（中灰） */
            
            /* 背景色：精选流光微渐变（由右上角浅蓝浅紫向左下角纯白柔和过渡，做背景极其高级） */
            --panel-gradient-bg: linear-gradient(135deg, #f5f8ff 0%, #fafdff 40%, #ffffff 100%);
            
            --panel-border-color: rgba(0, 0, 0, 0.06);   /* 外圈细微线条边框颜色 */
            --panel-border-radius: 24px;                 /* 整个大背景舱的现代大圆角 */
        }

        /* ====================================================
           🛠️ 核心架构样式（全自适应拉伸逻辑）
           ==================================================== */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
        }
        
        body, html { 
            width: 100%;
            height: 100%; /* 锁死高宽，填满窗口 */
            overflow: hidden; 
            background: transparent !important; /* 保持最外层完全透明，完美嵌入建站宝盒 */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: var(--page-margin);       
        }

        /* 💎 现代主义全自适应流光背景舱 */
        .form-visual-deck {
            width: 100%;
            height: 100%; /* 关键：高度100%自适应嵌入的窗口拉动 */
            min-height: var(--container-min-height); /* 关键：最小高度兜底，绝对不缩水 */
            
            background: var(--panel-gradient-bg) !important; 
            
            /* 极简高阶设计：纯外边框，无死板阴影 */
            border: 1px solid var(--panel-border-color) !important;
            border-radius: var(--panel-border-radius) !important;
            box-shadow: none !important; 
            
            /* 精密边距绑定 */
            padding: var(--container-padding-top) var(--container-padding-x) 24px var(--container-padding-x);
            display: flex;
            flex-direction: column;
        }

        /* 标题组排版空间 */
        .form-header-group {
            display: flex;
            flex-direction: column;
            gap: var(--title-gap);
            text-align: left; 
            width: 100%;
            flex-shrink: 0; /* 确保标题文字不会被压缩变形 */
        }

        /* 动态标题渲染 */
        .form-header-group h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--bg-title-color);
            letter-spacing: -0.3px;
            line-height: 1.3;
        }
        .form-header-group h2::before { content: var(--text-title); }

        /* 动态简介副标题 */
        .form-header-group p {
            font-size: 13px;
            color: var(--bg-subtitle-color);
            line-height: 1.5;
            font-weight: 500;
        }
        .form-header-group p::before { content: var(--text-subtitle); }

        /* 占位透空舱：专门用来对齐和容纳你叠在正上方的建站宝盒组件 */
        .form-content-slot {
            margin-top: var(--content-top-gap);
            width: 100%;
            flex: 1; /* 自动撑满剩余的所有垂直空间，形成完美的背景保护盾 */
            background: transparent; /* 完全透明，允许上层组件正常操作 */
        }
    </style>
</head>
<body>

    <div class="form-visual-deck">
        
        <div class="form-header-group">
            <h2></h2>
            <p></p>
        </div>

        <div class="form-content-slot"></div>

    </div>

</body>
</html>
