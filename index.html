<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>恒大世纪广场写字楼-周边配套</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <script type="text/javascript">
        window._AMapSecurityConfig = {
            securityJsCode: '1a299e101b30418737d94d5a74113bd3', 
        }
    </script>
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=04bee4addf98a8b9eb0d095d331297ab"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: "Microsoft YaHei", sans-serif; background-color: #f4f7f9; }
        #container { display: flex; height: 100vh; overflow: hidden; }
        
        /* 侧边栏：固定宽度 */
        #panel { width: 320px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; box-shadow: 2px 0 8px rgba(0,0,0,0.05); z-index: 10; }
        .header { padding: 25px 20px; background: #1a73e8; color: #fff; }
        .header h2 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        
        /* 列表区域：自适应剩余高度并可滚动 */
        .poi-list { flex: 1; overflow-y: auto; }
        .poi-item { padding: 18px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s; }
        .poi-item:hover { background: #f6faff; }
        .poi-item h4 { margin: 0 0 6px 0; color: #333; font-size: 16px; }
        .poi-item p { margin: 0; font-size: 13px; color: #777; line-height: 1.5; }
        
        #map-area { flex: 1; }

        /* 信息窗样式 */
        .custom-info { padding: 5px; line-height: 1.5; font-size: 13px; }
        .custom-info b { color: #1a73e8; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
<div id="container">
    <div id="panel">
        <div class="header"><h2>周边配套设施</h2></div>
        <div class="poi-list" id="poi-list"></div>
    </div>
    <div id="map-area"></div>
</div>

<script>
    // 1. 数据配置
    const pois = [
        { name: "恒大世纪广场", type: "center", pos: [114.319443, 30.573807], desc: "【本项目】核心写字楼所在地" },
        { name: "轨道交通5号线-(三层楼站)", type: "交通", pos: [114.3153, 30.56992], desc: "邻近积玉桥双线枢纽(2/5号线)，无缝衔接武昌与汉口核心" },
        { name: "和平大道三角路站 (公交站)", type: "交通", pos: [114.31891, 30.573965], desc: "下楼即达；多路公交直通武汉核心区。" },
        { name: "武昌江滩 (临江大道)", type: "临近江滩", pos: [114.317478, 30.579929], desc: "长江生态走廊，一线江景配套" },
        { name: "漫时区(商业街)", type: "漫时区", pos: [114.323572, 30.574851], desc: "集餐饮、咖啡、健身于一体，商务洽谈首选。" }
    ];

    // 初始化地图
    const map = new AMap.Map('map-area', {
        zoom: 15,
        center: [114.319443, 30.573807], // 初始以本项目为中心
        viewMode: '3D'
    });

    const markers = [];
    const infoWindow = new AMap.InfoWindow({ 
        offset: new AMap.Pixel(0, -30),
        autoMove: true // 气泡弹出时自动移动地图使其可见
    });

    // 2. 核心交互函数：居中并显示信息
    function focusPoint(item) {
        // 使用 panTo 平滑移动到中心，或者 setCenter 直接设为中心
        map.setZoomAndCenter(17, item.pos); 
        
        // 显示气泡窗口
        infoWindow.setContent(`<div class="custom-info"><b>${item.name}</b>${item.desc}</div>`);
        infoWindow.open(map, item.pos);
    }

    // 3. 渲染列表和标记
    function render() {
        const listContainer = document.getElementById('poi-list');
        listContainer.innerHTML = '';

        pois.forEach(item => {
            // A. 生成列表项
            const div = document.createElement('div');
            div.className = 'poi-item';
            div.innerHTML = `<h4>${item.name}</h4><p>${item.desc}</p>`;
            div.onclick = () => focusPoint(item); // 点击列表居中
            listContainer.appendChild(div);

            // B. 颜色配置
            let bgColor = '#1a73e8'; 
            if (item.type === 'center') {
                bgColor = '#ff4d4f'; 
            } else if (item.type === '临近江滩') {
                bgColor = '#00afc7'; 
            } else if (item.type === '漫时区') {
                bgColor = '#ff9c6e'; 
            }

            // C. 创建地图标记
            const marker = new AMap.LabelMarker({
                name: item.name,
                position: item.pos,
                text: {
                    content: item.name,
                    direction: 'top',
                    style: {
                        fontSize: 12,
                        fillColor: '#fff',
                        backgroundColor: bgColor,
                        padding: [4, 8],
                        borderRadius: 4
                    }
                },
                icon: { size: [0, 0] }
            });

            marker.on('click', () => focusPoint(item)); // 点击标记居中
            markers.push(marker);
        });
        
        const layer = new AMap.LabelsLayer({ zIndex: 1000 });
        map.add(layer);
        layer.add(markers);
    }

    // 初始执行渲染
    render();
</script>
</body>
</html>
