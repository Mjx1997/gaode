<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>恒大世纪广场-周边配套(智能居中版)</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    
    <script type="text/javascript">
        window._AMapSecurityConfig = { securityJsCode: '1a299e101b30418737d94d5a74113bd3' };
    </script>
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=04bee4addf98a8b9eb0d095d331297ab"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
        #map-area { width: 100%; height: 100%; position: absolute; }

        /* --- 顶部分类导航栏样式 --- */
        .glass-panel {
            position: absolute; top: 12px; left: 12px; z-index: 10;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 6px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; gap: 6px;
        }
        .filter-btn {
            padding: 8px 15px; border: none; background: transparent;
            border-radius: 8px; cursor: pointer; font-size: 13px; color: #555;
            transition: all 0.3s; font-weight: bold;
        }
        .filter-btn.active { background: #1a73e8; color: #fff; }

        /* --- 标记点样式 --- */
        .marker-label {
            padding: 5px 12px; background: #fff; border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 12px;
            font-weight: bold; border: 2px solid #1a73e8; white-space: nowrap;
        }
        .marker-center { background: #ff4d4f; color: #fff; border-color: #fff; transform: scale(1.1); z-index: 100; }
        
        /* 气泡窗 */
        .info-card { padding: 10px; min-width: 150px; line-height: 1.4; }
        .info-card b { color: #1a73e8; font-size: 14px; }
    </style>
</head>
<body>

<div class="glass-panel" id="filter-group">
    <button class="filter-btn active" onclick="filterData('all', this)">本写字楼</button>
    <button class="filter-btn" onclick="filterData('traffic', this)">交通</button>
    <button class="filter-btn" onclick="filterData('scenery', this)">休闲</button>
    <button class="filter-btn" onclick="filterData('business', this)">商业</button>
</div>

<div id="map-area"></div>

<script>
    // 1. 【数据中心】：在这里增加或修改坐标点
    const pois = [
        { name: "恒大世纪广场", type: "center", pos: [114.319443, 30.573807], desc: "本项目核心位置" },
        { name: "5号线-三层楼站", type: "traffic", pos: [114.3153, 30.56992], desc: "双线枢纽，出行便利" },
        { name: "三角路公交站", type: "traffic", pos: [114.31891, 30.573965], desc: "楼下即是多路公交" },
        { name: "武昌江滩", type: "scenery", pos: [114.317478, 30.579929], desc: "一线江景配套" },
        { name: "漫时区商业街", type: "business", pos: [114.323572, 30.574851], desc: "商务洽谈、餐饮首选" }
    ];

    // 2. 【智能居中锚点】：点击分类时，地图会以哪个坐标为中心？
    const centerAnchors = {
        'all': [114.319443, 30.573807],     // 全部：回到写字楼
        'traffic': [114.31891, 30.573965],   // 交通：移至公交站
        'scenery': [114.317478, 30.579929],  // 休闲：移至江滩
        'business': [114.323572, 30.574851]  // 商业：移至商业街
    };

    const map = new AMap.Map('map-area', {
        zoom: 15, center: centerAnchors['all'], viewMode: '2D', mapStyle: 'amap://styles/light'
    });

    const markers = [];
    const infoWindow = new AMap.InfoWindow({ offset: new AMap.Pixel(0, -30) });

    function initMarkers() {
        pois.forEach(item => {
            const div = document.createElement('div');
            div.className = `marker-label ${item.type === 'center' ? 'marker-center' : ''}`;
            div.innerHTML = item.name;

            const marker = new AMap.Marker({
                position: item.pos, content: div, offset: new AMap.Pixel(-40, -15), extData: { type: item.type }
            });

            marker.on('click', () => {
                infoWindow.setContent(`<div class="info-card"><b>${item.name}</b><br>${item.desc}</div>`);
                infoWindow.open(map, item.pos);
            });

            markers.push(marker);
        });
        map.add(markers);
    }

    // 3. 【核心逻辑】：点击分类时的智能移动
    function filterData(type, btn) {
        // A. 切换按钮高亮
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // B. 过滤显示点
        let visibleMarkers = [];
        markers.forEach(m => {
            const mType = m.getExtData().type;
            if (type === 'all' || mType === 'center' || mType === type) {
                m.show(); visibleMarkers.push(m);
            } else { m.hide(); }
        });

        // C. 【重点】智能平滑居中：以预设锚点为中心，并自动适应窗口
        map.setZoomAndCenter(16, centerAnchors[type] || centerAnchors['all']);
        
        // 如果是“全部”，则尝试展示所有点
        if(type === 'all') {
            map.setFitView(visibleMarkers, false, [60, 60, 60, 60], 16);
        }
    }

    initMarkers();
</script>
</body>
</html>
