<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恒大世纪广场-在租房源列表</title>
    <style>
        /* 全局样式设定 */
        body, html { 
            margin: 0; 
            padding: 0; 
            background-color: transparent; /* 背景透明，方便嵌入其他页面 */
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto 30px auto; /* 底部留白，防止卡片贴底 */
            background: #ffffff;
            padding: 20px;
            border-radius: 16px; /* 圆角稍微调大一点点，更现代 */
            box-shadow: 0 8px 30px rgba(0,0,0,0.05); /* 调深一点点阴影，增强立体感 */
            border: 1px solid #f2f4f7; /* 淡淡的边框线 */
        }

        /* 顶部筛选区域 */
        .header-bar {
            display: flex;
            justify-content: flex-end; /* 修改这里：由 space-between 改为 flex-end，右对齐 */
            align-items: center;
            background: transparent; /* 强制背景透明 */
            border: none; /* 确保无边框 */
            padding: 0 5px; /* 避免标签贴边 */
        }
        .list-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a1a1a;
        }
        .filter-tabs {
            display: flex;
            gap: 8px;
        }
        .tab-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #eee;
            background: #f8f9fa;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            transition: 0.2s;
        }
        .tab-btn:hover { background: #eef2f7; }
        .tab-btn.active {
            background: #1a73e8;
            color: #fff;
            border-color: #1a73e8;
            font-weight: bold;
        }

        /* 列表表头：对齐下面的内容列 */
        .list-header {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1.5fr 1fr 0.8fr; /* 灵活分配列宽 */
            padding: 12px 20px;
            background: #f9fafb;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #888;
            margin-bottom: 10px;
        }

        /* 列表项样式 */
        .house-list { display: flex; flex-direction: column; gap: 8px; }
        .house-item {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1.5fr 1fr 0.8fr; /* 与表头保持一致 */
            align-items: center;
            padding: 18px 20px;
            border-radius: 10px;
            border: 1px solid #f2f4f7;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .house-item:hover {
            background: #f6faff;
            border-color: #1a73e8;
            transform: scale(1.005);
            box-shadow: 0 4px 12px rgba(26,115,232,0.08);
        }

        /* 各个列的具体修饰 */
        .col-area { font-size: 18px; font-weight: bold; color: #1a73e8; }
        .col-area span { font-size: 12px; margin-left: 2px; }
        
        .col-floor { font-size: 14px; color: #444; }
        
        .col-standard { font-size: 14px; color: #555; }
        
        /* 状态标签样式 */
        .col-status { display: flex; align-items: center; }
        .status-badge {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .ready { background: #e6f7ff; color: #1a73e8; }
        .booked { background: #fff7e6; color: #fa8c16; }
        .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

        /* 操作按钮 */
        .col-action { text-align: right; }
        .detail-link {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            background: #f0f7ff;
            transition: 0.2s;
        }
        .detail-link:hover { background: #1a73e8; color: #fff; }

        /* 移动端适配：如果屏幕太窄，自动隐藏不重要的列 */
        @media (max-width: 600px) {
            /* 添加下面这个样式，让导航栏在窄屏下居中 */
            .header-bar {
                justify-content: center; /* 移动端居中 */
                margin-top: 15px;
                margin-bottom: 10px;
            }
            .list-header { display: none; }
            .house-item { 
                grid-template-columns: 1fr 1fr; 
                gap: 10px;
                padding: 15px;
            }
            .col-standard, .col-floor { font-size: 12px; }
            .col-action { grid-column: span 2; border-top: 1px solid #eee; padding-top: 10px; text-align: center; }
        }
    </style>
</head>
<body>

<div class="header-bar" style="max-width: 1000px; margin: 20px auto 5px auto;">
    <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterHouse('all', this)">全部</button>
            <button class="tab-btn" onclick="filterHouse('high', this)">高区</button>
            <button class="tab-btn" onclick="filterHouse('scenery', this)">江景</button>
        </div>
    </div>

    <div class="container">
    <div class="list-header">
        <div>面积</div>
        <div>楼层</div>
        <div>交付标准</div>
        <div>状态</div>
        <div style="text-align: right;">操作</div>
    </div>

    <div class="house-list" id="houseList">
        </div>
</div>

<script>
    /**
     * 【数据修改指南】
     * 如果你想增加或修改房源，只需在下面的 houseData 数组中增删对象即可。
     * 字段说明：
     * area: 面积数字
     * floor: 所在楼层
     * standard: 交付标准（如：精装修、毛坯、带家具）
     * status: 逻辑状态（ready 代表在租，booked 代表已租/预订）
     * statusText: 显示出来的文字
     * type: 对应顶部的分类按钮
     */
    const houseData = [
        { area: '285', floor: '12层', type: 'mid', standard: '精装修 · 带全套家具', status: 'ready', statusText: '随时入驻', link: '#' },
        { area: '420', floor: '18层', type: 'high', standard: '标准装修 · 吊顶白墙', status: 'ready', statusText: '随时入驻', link: '#' },
        { area: '1,100', floor: '25层', type: 'high', standard: '毛坯现房 · 空间自由', status: 'ready', statusText: '随时入驻', link: '#' },
        { area: '1,200', floor: '43层', type: 'scenery', standard: '顶级装修 · 环幕江景', status: 'ready', statusText: '随时入驻', link: '#' },
        { area: '150', floor: '6层', type: 'low', standard: '简约装修 · 采光极佳', status: 'booked', statusText: '已预订', link: '#' }
    ];

    /**
     * 渲染函数
     */
    function renderList(data) {
        const listContainer = document.getElementById('houseList');
        listContainer.innerHTML = '';
        
        data.forEach(item => {
            const statusClass = item.status === 'ready' ? 'ready' : 'booked';
            const dotColor = item.status === 'ready' ? '#1a73e8' : '#fa8c16';
            
            const itemHtml = `
                <div class="house-item" onclick="window.open('${item.link}', '_parent')">
                    <div class="col-area">${item.area}<span>㎡</span></div>
                    <div class="col-floor">${item.floor}</div>
                    <div class="col-standard">${item.standard}</div>
                    <div class="col-status">
                        <span class="status-badge ${statusClass}">
                            <span class="dot" style="background:${dotColor}"></span>
                            ${item.statusText}
                        </span>
                    </div>
                    <div class="col-action">
                        <a href="${item.link}" class="detail-link">详情</a>
                    </div>
                </div>
            `;
            listContainer.innerHTML += itemHtml;
        });
    }

    /**
     * 过滤函数
     */
    function filterHouse(category, btn) {
        // 切换按钮高亮
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // 执行过滤逻辑
        const filtered = category === 'all' ? houseData : houseData.filter(h => h.type === category);
        renderList(filtered);
    }

    // 初始渲染
    renderList(houseData);
</script>
</body>
</html>
