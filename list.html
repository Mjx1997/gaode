<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在租房源列表-卡片版</title>
    <style>
        /* 1. 关键修改：网页最外层设为透明 */
        body, html { 
            margin: 0; 
            padding: 0; 
            background-color: transparent; 
        }
        
        /* 2. 保留白色容器背景，并添加轻微圆角和阴影，使其更有质感 */
        .container { 
            max-width: 900px; 
            margin: 10px auto; 
            background: #ffffff; /* 保留白色背景 */
            padding: 25px; 
            border-radius: 12px; /* 圆角 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); /* 淡淡的阴影，让卡片浮起来 */
        }
        
        /* 头部样式 */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .title { font-size: 20px; font-weight: bold; color: #333; }
        
        /* 切换按钮 */
        .tabs { display: flex; gap: 8px; }
        .tab-btn { padding: 7px 18px; border-radius: 20px; border: none; cursor: pointer; font-size: 13px; background: #f0f2f5; color: #666; transition: 0.3s; }
        .tab-btn.active { background: #56eadd; color: #333; font-weight: bold; }

        /* 表格样式 */
        table { width: 100%; border-collapse: collapse; }
        th { background: #f9fafc; color: #888; font-weight: normal; padding: 12px; text-align: left; font-size: 13px; border-bottom: 2px solid #f0f2f5; }
        td { padding: 16px 12px; border-bottom: 1px solid #f0f2f5; font-size: 14px; color: #444; }
        
        /* 状态标记 */
        .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
        .status-ready { background: #27ae60; }
        .status-booked { background: #e67e22; }

        .detail-link { color: #1a73e8; text-decoration: none; font-weight: 500; }
        .detail-link:hover { text-decoration: underline; }

        /* 移动端适配：隐藏不太重要的“交付标准”列 */
        @media (max-width: 600px) {
            th:nth-child(3), td:nth-child(3) { display: none; }
            .container { padding: 15px; margin: 5px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        
        <div class="tabs" id="tabGroup">
            <button class="tab-btn active" onclick="filterData('all', this)">全部在租</button>
            <button class="tab-btn" onclick="filterData('high', this)">高区楼层</button>
            <button class="tab-btn" onclick="filterData('scenery', this)">江景户型</button>
        </div>
    </div>

    <table id="houseTable">
        <thead>
            <tr>
                <th>面积 (㎡)</th>
                <th>楼层</th>
                <th>交付标准</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
    // 1. 数据配置
    const houseData = [
        { area: '285', floor: '12层', type: 'mid', standard: '标准装修', status: 'ready', statusText: '随时入驻', link: '#' },
        { area: '420', floor: '18层', type: 'high', standard: '毛坯现房', status: 'ready', statusText: '随时入驻', link: '#' },
        { area: '1,100', floor: '25层', type: 'high', standard: '整层交付', status: 'ready', statusText: '随时入驻', link: '#' },
        { area: '1,200', floor: '43层', type: 'scenery', standard: '整层交付', status: 'ready', statusText: '随时入驻', link: '#' }, // 你的江景房
        { area: '150', floor: '6层', type: 'low', standard: '精致装修', status: 'booked', statusText: '预订中', link: '#' }
    ];

    // 2. 渲染函数
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        data.forEach(item => {
            const row = `
                <tr>
                    <td style="color:#1a73e8; font-weight:bold;">${item.area}</td>
                    <td>${item.floor}</td>
                    <td>${item.standard}</td>
                    <td>
                        <span class="status-dot ${item.status === 'ready' ? 'status-ready' : 'status-booked'}"></span>
                        ${item.statusText}
                    </td>
                    <td><a href="${item.link}" class="detail-link" target="_parent">详情</a></td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    // 3. 过滤逻辑（已优化为通用版本）
    function filterData(category, btn) {
        // 更新按钮样式
        const btns = document.querySelectorAll('.tab-btn');
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // 执行过滤
        if (category === 'all') {
            renderTable(houseData); // 如果是全部，显示所有
        } else {
            // 自动匹配 houseData 里的 type 属性
            const filtered = houseData.filter(h => h.type === category);
            renderTable(filtered);
        }
    }

    // 初始加载全部
    renderTable(houseData);
</script>

</body>
</html>
