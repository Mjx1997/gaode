<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恒大世纪广场-在租房源列表</title>
    <style>
        /* 全局样式设定 */
        body, html { 
            margin: 0; 
            padding: 0; 
            background-color: transparent; /* 背景透明，方便嵌入其他页面 */
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #333;
            width: 100%;
        }

        /* 💻 100% 流式自适应容器：去除了固定的 max-width 限制，随外层窗口自由拉伸 */
        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }

        /* 顶部筛选区域 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f2f2f2;
        }
        .list-title {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a;
        }
        .filter-tabs {
            display: flex;
            gap: 8px;
        }
        .tab-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #eee;
            background: #f8f9fa;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            transition: 0.2s;
        }
        .tab-btn:hover { background: #eef2f7; }
        .tab-btn.active {
            background: #1a73e8;
            color: #fff;
            border-color: #1a73e8;
            font-weight: bold;
        }

        /* 列表表头：对齐下面的内容列 */
        .list-header {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1.5fr 1fr 0.8fr; /* 灵活分配列宽 */
            padding: 12px 20px;
            background: #f9fafb;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #888;
            margin-bottom: 10px;
        }

        /* 列表项容器样式 */
        .house-list { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            min-height: 550px; /* 💡 关键：固定 8 条数据的默认视觉高度，防止少数据时窗口塌陷缩短 */
        }
        .house-item {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1.5fr 1fr 0.8fr; /* 与表头保持一致 */
            align-items: center;
            padding: 18px 20px;
            border-radius: 10px;
            border: 1px solid #f2f4f7;
            transition: all 0.2s ease;
            cursor: pointer;
            background: #ffffff;
        }
        .house-item:hover {
            background: #f6faff;
            border-color: #1a73e8;
            transform: scale(1.002);
            box-shadow: 0 4px 12px rgba(26,115,232,0.08);
        }

        /* 各个列的具体修饰 */
        .col-area { font-size: 18px; font-weight: bold; color: #1a73e8; }
        .col-area span { font-size: 12px; margin-left: 2px; }
        
        .col-floor { font-size: 14px; color: #444; }
        
        .col-standard { font-size: 14px; color: #555; }
        
        /* 状态标签样式 */
        .col-status { display: flex; align-items: center; }
        .status-badge {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .ready { background: #e6f7ff; color: #1a73e8; }
        .booked { background: #fff7e6; color: #fa8c16; }
        .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

        /* 操作按钮 */
        .col-action { text-align: right; }
        .detail-link {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            background: #f0f7ff;
            transition: 0.2s;
        }
        .detail-link:hover { background: #1a73e8; color: #fff; }

        /* 📑 底部高级分页组件样式 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            padding-top: 15px;
            border-top: 1px solid #f2f2f2;
        }
        .page-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #e1e4e8;
            background: #ffffff;
            cursor: pointer;
            font-size: 13px;
            color: #555;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        .page-btn:hover:not(.disabled) {
            background: #f0f4f9;
            border-color: #1a73e8;
            color: #1a73e8;
        }
        .page-btn.active {
            background: #1a73e8;
            color: #ffffff;
            border-color: #1a73e8;
            font-weight: bold;
        }
        .page-btn.disabled {
            background: #f5f5f5;
            color: #b5b5b5;
            cursor: not-allowed;
            border-color: #e1e4e8;
        }

        /* 📱 移动端自适应完美保留 */
        @media (max-width: 600px) {
            .list-header { display: none; }
            .house-item { 
                grid-template-columns: 1fr 1fr; 
                gap: 10px;
                padding: 15px;
            }
            .col-standard, .col-floor { font-size: 12px; }
            .col-action { grid-column: span 2; border-top: 1px solid #eee; padding-top: 10px; text-align: center; }
            .house-list { min-height: auto; } /* 移动端卡片高度变动大，解除最小高度限制 */
            .pagination { margin-top: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="list-title">在租房源</div>
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterHouse('all', this)">全部</button>
            <button class="tab-btn" onclick="filterHouse('high', this)">高区</button>
            <button class="tab-btn" onclick="filterHouse('scenery', this)">江景</button>
        </div>
    </div>

    <div class="list-header">
        <div>面积</div>
        <div>楼层</div>
        <div>交付标准</div>
        <div>状态</div>
        <div style="text-align: right;">操作</div>
    </div>

    <div class="house-list" id="houseList"></div>

    <div class="pagination" id="pagination"></div>
</div>

<script>
    /**
     * 【原始房源数据库集群】
     * 提示：后期只需在这个数组里无脑添加新对象即可，代码会自动分页渲染，无需再次调整任何高度和逻辑！
     */
    const houseData = [
        { area: '285', floor: '12层', type: 'mid', standard: '精装修 · 带全套家具', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/1201.html' },
        { area: '420', floor: '18层', type: 'high', standard: '标准装修 · 吊顶白墙', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/1201.html' },
        { area: '1,100', floor: '25层', type: 'high', standard: '毛坯现房 · 空间自由', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/1201.html' },
        { area: '1,200', floor: '43层', type: 'scenery', standard: '顶级装修 · 环幕江景', status: 'ready', statusText: '随时入驻', link: 'http://www.hdcentury.com/1201.html' },
        { area: '150', floor: '6层', type: 'low', standard: '简约装修 · 采光极佳', status: 'booked', statusText: '已预订', link: 'http://www.hdcentury.com/1201.html' }
    ];

    // 分页管理核心状态控制变量
    let currentCategory = 'all'; // 当前激活的顶部筛选分类
    let currentPage = 1;          // 当前所处页码
    const itemsPerPage = 8;       // 💡 每页固定展示的房源最大条数

    /**
     * 根据当前分类筛选原始数据
     */
    function getFilteredData() {
        return currentCategory === 'all' 
            ? houseData 
            : houseData.filter(h => h.type === currentCategory);
    }

    /**
     * 核心渲染驱动引擎：合并处理筛选+分页切割渲染
     */
    function renderList() {
        const filtered = getFilteredData();
        const totalItems = filtered.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
        
        // 健壮性自检：防止页码超出安全边界范围
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        // 计算当前页数据的切片起止索引
        const startIndex = (currentPage - 1) * itemsPerPage;
        const pageData = filtered.slice(startIndex, startIndex + itemsPerPage);

        const listContainer = document.getElementById('houseList');
        listContainer.innerHTML = '';
        
        // 如果当前分类下毫无数据，进行友好空提示
        if (pageData.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center;color:#999;padding:60px 0;font-size:14px;width:100%;grid-column: span 5;">暂无对应在租房源记录</div>';
        } else {
            // 循环遍历并吐出渲染内容
            pageData.forEach(item => {
                const statusClass = item.status === 'ready' ? 'ready' : 'booked';
                const dotColor = item.status === 'ready' ? '#1a73e8' : '#fa8c16';
                
                const itemHtml = `
                    <div class="house-item" onclick="window.open('${item.link}', '_parent')">
                        <div class="col-area">${item.area}<span>㎡</span></div>
                        <div class="col-floor">${item.floor}</div>
                        <div class="col-standard">${item.standard}</div>
                        <div class="col-status">
                            <span class="status-badge ${statusClass}">
                                <span class="dot" style="background:${dotColor}"></span>
                                ${item.statusText}
                            </span>
                        </div>
                        <div class="col-action">
                            <a href="${item.link}" class="detail-link">详情</a>
                        </div>
                    </div>
                `;
                listContainer.innerHTML += itemHtml;
            });
        }

        // 联动刷新底部的分页按钮状态
        renderPagination(totalPages);
    }

    /**
     * 动态生成并挂载底部控制按钮
     */
    function renderPagination(totalPages) {
        const paginationContainer = document.getElementById('pagination');
        paginationContainer.innerHTML = '';

        // 1. 上一页按钮
        const prevBtn = document.createElement('button');
        prevBtn.className = `page-btn ${currentPage === 1 ? 'disabled' : ''}`;
        prevBtn.innerText = '上一页';
        prevBtn.onclick = (e) => {
            e.stopPropagation();
            if (currentPage > 1) {
                currentPage--;
                renderList();
            }
        };
        paginationContainer.appendChild(prevBtn);

        // 2. 循环生成数字页码按钮
        for (let i = 1; i <= totalPages; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            pageBtn.innerText = i;
            pageBtn.onclick = (e) => {
                e.stopPropagation();
                currentPage = i;
                renderList();
            };
            paginationContainer.appendChild(pageBtn);
        }

        // 3. 下一页按钮
        const nextBtn = document.createElement('button');
        nextBtn.className = `page-btn ${currentPage === totalPages ? 'disabled' : ''}`;
        nextBtn.innerText = '下一页';
        nextBtn.onclick = (e) => {
            e.stopPropagation();
            if (currentPage < totalPages) {
                currentPage++;
                renderList();
            }
        };
        paginationContainer.appendChild(nextBtn);
    }

    /**
     * 顶部标签分类过滤触发函数
     */
    function filterHouse(category, btn) {
        // 切换高亮样式
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // 状态更新并重置回第 1 页
        currentCategory = category;
        currentPage = 1; 
        renderList();
    }

    // 默认执行初始化渲染加载
    renderList();
</script>
</body>
</html>
