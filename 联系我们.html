<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>联系我们 - 手机版现代服务舱</title>
    <style>
        /* ====================================================
           🎨 1. 现代大厂色彩与动效控制台
           ==================================================== */
        :root {
            --brand-blue: #2563eb;       /* 品牌核心蓝 */
            --brand-green: #22c55e;      /* 微信生态绿 */
            --text-main: #1d1d1f;        /* 现代科技黑 */
            --text-muted: #86868b;       /* 优雅高级灰 */
            --card-bg: rgba(255, 255, 255, 0.85); /* 毛玻璃卡片背景 */
            --input-bg: #f5f5f7;         /* 纯净内衬底色 */
            
            /* 📐 边框微调核心控制台 */
            --card-border-color: rgba(0, 0, 0, 0.08); /* 正常状态下的微光外边框颜色 */
            --card-border-hover: rgba(37, 99, 235, 0.3); /* 点击/激活时的边框色 */
        }

        /* 全局流式重置，专为手机触控优化 */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent; /* 移除手机端点击生硬的蓝色高亮 */
        }
        
        body { 
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(180deg, #f4f7fc 0%, #eef2f7 100%); /* 舒适淡雅的多层微渐变后台 */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 24px 16px; /* 严格按照手机端安全边距 */
        }

        /* ====================================================
           💎 2. 口袋服务台主体容器
           ==================================================== */
        .contact-mobile-hub {
            width: 100%;
            max-width: 480px; /* 锁死移动端最佳视觉宽度 */
            display: flex;
            flex-direction: column;
            gap: 16px; /* 现代 UI 的黄金间距比例 */
        }

        /* 极简顶导视觉话术 */
        .hub-intro {
            text-align: center;
            padding: 10px 0;
            margin-bottom: 8px;
        }
        .hub-intro h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .hub-intro p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 通用毛玻璃边框卡片基底 */
        .hub-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px; /* 大圆角 */
            padding: 18px;
            
            /* ★ 核心升级：增加精致外边框，彻底移除阴影 (box-shadow) */
            border: 1px solid var(--card-border-color) !important;
            box-shadow: none !important; 
            
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 📱 手机端专属全动感微压缩反馈 */
        .hub-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.95);
            border-color: var(--card-border-hover) !important; /* 激活时边框颜色微微加深变蓝 */
        }

        /* 图标质感外壳 */
        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .icon-box svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* 卡片文字排版排布 */
        .card-meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            overflow: hidden;
        }
        .card-title {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 右侧交互引导小箭头 */
        .arrow-action {
            color: #c7c7cc;
            display: flex;
            align-items: center;
            margin-left: auto;
        }
        .arrow-action svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* ====================================================
           🎨 3. 差异化板块主题色彩
           ==================================================== */
        /* 电话卡片 */
        .card-phone .icon-box { background: rgba(37, 99, 235, 0.08); color: var(--brand-blue); }
        /* 微信卡片 */
        .card-wechat .icon-box { background: rgba(34, 197, 94, 0.08); color: var(--brand-green); }
        /* 地址卡片 */
        .card-location .icon-box { background: rgba(244, 63, 94, 0.08); color: #f43f5e; }
        
        /* 时间卡片（无点击反馈与边框加深） */
        .card-time { cursor: default; }
        .card-time:active { transform: none; background: var(--card-bg); border-color: var(--card-border-color) !important; }
        .card-time .icon-box { background: rgba(234, 179, 8, 0.08); color: #eab308; }

        /* ====================================================
           ✨ 4. 一键复制成功的现代动态吐司提示 (Toast)
           ==================================================== */
        .toast-notification {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: rgba(29, 29, 31, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="contact-mobile-hub">
        
        <div class="hub-intro">
            <h1>联系我们</h1>
            <p>点击下方卡片，即可一键直达专属招商服务</p>
        </div>

        <a href="tel:13212345678" class="hub-card card-phone">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            </div>
            <div class="card-meta">
                <span class="card-title">招商服务热线</span>
                <span class="card-value">132-1234-5678</span>
            </div>
            <div class="arrow-action">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
        </a>

        <a href="javascript:void(0);" onclick="copyWeChatID('HD_Centurys')" class="hub-card card-wechat">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 2.75 1.12 5.24 2.94 7.05L4 22l3.14-1.03C8.6 21.6 10.25 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm-3.5 9c-.83 0-1.5-.67-1.5-1.5S7.67 8 8.5 8s1.5.67 1.5 1.5S9.33 11 8.5 11zm7 0c-.83 0-1.5-.67-1.5-1.5S14.67 8 15.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            </div>
            <div class="card-meta">
                <span class="card-title">官方微信客服</span>
                <span class="card-value">HD_Centurys</span>
            </div>
            <div class="arrow-action" style="color: var(--brand-green); font-size: 12px; font-weight: bold;">
                复制
            </div>
        </a>

        <a href="javascript:void(0);" onclick="alert('正在调起高德地图为您导航...')" class="hub-card card-location">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            </div>
            <div class="card-meta">
                <span class="card-title">项目入驻地址</span>
                <span class="card-value" style="white-space: normal; line-height: 1.4;">武汉市武昌区和平大道恒大世纪广场</span>
            </div>
            <div class="arrow-action">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
        </a>

        <div class="hub-card card-time">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            </div>
            <div class="card-meta">
                <span class="card-title">招商中心服务时间</span>
                <span class="card-value">周一至周日 09:00 - 18:00</span>
            </div>
        </div>

    </div>

    <div class="toast-notification" id="copy-toast">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:#22c55e;"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        微信号复制成功，可直接添加
    </div>

    <script>
        function copyWeChatID(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 1800);
            }).catch(err => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                const toast = document.getElementById('copy-toast');
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 1800);
            });
        }
    </script>
</body>
</html>
